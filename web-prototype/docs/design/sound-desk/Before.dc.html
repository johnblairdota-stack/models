<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; background: #0b0d12; font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
    a { color: #e0b23c; } a:hover { color: #f0cf6a; }
    button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: default; }
  </style>
</helmet>
<div style="box-sizing:border-box;width:390px;height:844px;background:#0b0d12;color:#f2f4f8;display:flex;flex-direction:column;gap:14px;padding:14px;font:400 17px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
  <div style="display:flex;align-items:center;gap:10px;font:400 13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.1em;color:#8b93a3;text-transform:uppercase;font-variant-numeric:tabular-nums">
    <span style="width:14px;height:14px;border-radius:50%;flex:none;background:#4cc27a"></span>
    <span style="color:#f2f4f8;font-weight:700;text-transform:none;letter-spacing:0;font-size:15px">ALI</span>
    <span>connected</span><span style="margin-left:auto">28ms</span>
  </div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
    <h2 style="font:700 22px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:0">Expedition</h2>
    <span style="font:700 22px/1 ui-monospace,Menlo,monospace;color:#e0b23c;font-variant-numeric:tabular-nums">52s</span>
  </div>
  <div style="background:#161b25;border:1px solid #262d3d;border-radius:16px;padding:16px">
    <div style="color:#8b93a3;font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">You can see what the cameras can see. Tell them.</div>
  </div>
  <div style="background:#161b25;border:1px solid #262d3d;border-radius:16px;padding:16px">
    <h3 style="font:600 12px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8b93a3;margin:0 0 12px">Your cameras</h3>
<svg viewBox="-14.8 -39.0 29.6 47.2" width="100%" height="248" preserveAspectRatio="xMidYMid meet" style="display:block;flex:none;background:#0d1017;border-radius:12px">
      <g>
      <rect x="-13.6" y="-31" width="27.2" height="6.7" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />
      <rect x="-13.6" y="-24" width="11.6" height="15.4" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />
      <rect x="-1.7" y="-24" width="3.4" height="15.4" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />
      <rect x="2" y="-24" width="11.6" height="15.4" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />
      <rect x="-13.6" y="-8.3" width="27.2" height="15.3" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />
      <rect x="4.2" y="-37.8" width="6.8" height="6.5" fill="#161b25" stroke="#2a3244" stroke-width="1" vector-effect="non-scaling-stroke" />





      </g>

    </svg>
    <div style="font:700 26px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#8b93a3;margin-top:10px">NO SIGNAL</div>
    <div style="color:#8b93a3;font:400 13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;margin-top:10px">Nothing on the east study. That is not the same as empty.</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button style="min-height:76px;border:0;border-radius:14px;background:#4cc27a;color:#06170d;font:700 22px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;width:100%">CLEAR</button>
    <button style="min-height:76px;border:0;border-radius:14px;background:#e0b23c;color:#171203;font:700 22px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;width:100%">HOLD</button>
  </div>
  <div><button style="width:100%;min-height:60px;border:0;border-radius:14px;background:#e4483a;color:#1a0605;font:600 18px/1.2 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:12px;display:flex;align-items:center;text-align:left">Refuse the chair</button>
    <div style="color:#8b93a3;font:400 13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;margin-top:10px">Once a game. Everyone is told it was you.</div></div>
  <button style="width:100%;min-height:60px;border-radius:14px;background:#161b25;color:#f2f4f8;border:1px solid #262d3d;font:600 18px/1.2 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:12px;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#8b93a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="2.5" width="13" height="15" rx="2"/><path d="M7 7h6M7 10.5h6"/></svg>
    <span>Your card — hold to read</span>
  </button>
</div>
</x-dc>

</html>
