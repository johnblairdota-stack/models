<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    a { color: #f5a14a; } a:hover { color: #ffbe7d; }
  </style>
</helmet>

<!-- ═══════ THE PHONE DOES ALMOST NOTHING FOR FIFTEEN SECONDS, AND THAT IS THE POINT ═══════
     The Verdict is the Showrunner's announcement on the TELEVISION. A pad that competed with it
     would split the room's attention at the one moment the whole night is being summarised —
     the same argument that took Word from the House off the runner's sheet. So: the status, the
     one line that says what happens next, and nothing to press.

     The seat DOES get one thing it cannot read off the TV: whether it is still in the show.
     `players[].alive` is already public, so this leaks nothing. -->

<div style="width: 390px; height: 844px; position: relative; background: #0c0a08; color: #f3ece3; overflow: hidden; display: flex; flex-direction: column; font-size: 16px;">

  <div style="flex: 0 0 auto; padding: 14px 16px 10px; background: #12100c; border-bottom: 1px solid rgba(245,161,74,.14);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 800; color: #f5a14a;">Verdict</div>
      <div style="font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">15</div>
    </div>
    <div style="margin-top: 6px; font-size: 15px; color: #a89884;">Eyes on the TV.</div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 26px 18px 10px; display: flex; flex-direction: column;">

    <div style="text-align: center;">
      <div style="font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; color: #8a7d70;">The season</div>
      <div style="margin-top: 12px; font-size: 46px; font-weight: 800; line-height: 1;">Renewed</div>
      <div style="margin-top: 14px; font-size: 17px; line-height: 1.4; color: #a89884;">Three cameras of four. The cellar is still dark.</div>
    </div>

    <div style="margin-top: 30px; padding: 16px 15px; border-radius: 12px; background: #12100c; border-left: 5px solid #9ff2c8;">
      <div style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 800; color: #8a7d70;">You</div>
      <div style="margin-top: 5px; font-size: 22px; font-weight: 800; color: #9ff2c8;">Still in the show</div>
      <div style="margin-top: 6px; font-size: 15px; color: #a89884;">Casting opens in a moment.</div>
    </div>

    <!-- One line, and it is the whole social engine: RENEWED tells good that evil is still
         alive, and tells them nothing whatsoever about the person they just destroyed. -->
    <div style="margin-top: auto; padding: 15px 15px 16px; border-radius: 12px; background: #080604; border: 1px solid rgba(255,138,122,.2);">
      <div style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 800; color: #ff8a7a;">Not said</div>
      <div style="margin-top: 6px; font-size: 16px; line-height: 1.45; color: #a89884;">Whether Sam was one of them. Nobody finds out until the Reunion — and that is the only reason the rest of the night works.</div>
    </div>
  </div>

  <div style="flex: 0 0 auto; padding: 12px 14px 22px; background: #12100c; border-top: 1px solid rgba(245,161,74,.14);">
    <div style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #161310; color: #4b423a; font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;">Nothing to press</div>
  </div>
</div>
</x-dc>
</body>
</html>
