<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    a { color: #f5a14a; } a:hover { color: #ffbe7d; }
  </style>
</helmet>

<!-- ═══════ THE BALLOT, AFTER THE RECEIPT ═══════
     L96 already ships the server-side receipt: the room now tells the voter what it actually
     recorded, including the self-vote coercion to NO ONE that used to happen silently.
     This is the screen that receipt deserves. Three things are new to the eye:
       · seat number and accent, so two players called Sam are two different ballots (D6/S1)
       · the receipt line, quoting the recorded choice back in the room's own words
       · the same pinned action bar as the Reckoning sheet, so the thumb never moves (S8) -->

<div style="width: 390px; height: 844px; position: relative; background: #0c0a08; color: #f3ece3; overflow: hidden; display: flex; flex-direction: column; font-size: 16px;">

  <div style="flex: 0 0 auto; padding: 14px 16px 10px; background: #12100c; border-bottom: 1px solid rgba(245,161,74,.14);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 800; color: #f5a14a;">Vote</div>
      <div style="font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;">{{clock}}</div>
    </div>
    <div style="margin-top: 6px; font-size: 15px; color: #a89884;">One ballot. Living majority carries.</div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 12px 12px 6px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 15px 13px; border-radius: 11px; background: {{o.bg}}; border: 2px solid {{o.edge}};">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: {{o.accent}}; color: #141210; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center;">{{o.seat}}</div>
          <div style="flex: 1 1 auto; min-width: 0;">
            <div style="font-size: 21px; font-weight: 800; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{o.name}}</div>
            <div style="margin-top: 3px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8a7d70;">{{o.sub}}</div>
          </div>
          <div style="flex: 0 0 auto; font-size: 22px; color: {{o.markTint}};">{{o.mark}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 0 0 auto; padding: 12px 14px 22px; background: #12100c; border-top: 1px solid rgba(245,161,74,.14);">
    <!-- the receipt: what the ROOM recorded, not what this phone thinks it sent -->
    <div style="padding: 11px 13px; border-radius: 10px; background: {{recBg}}; border-left: 5px solid {{recTint}}; margin-bottom: 12px;">
      <div style="font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 800; color: #8a7d70;">{{recKicker}}</div>
      <div style="margin-top: 4px; font-size: 17px; font-weight: 700; color: {{recTint}};">{{recLine}}</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 12px; background: {{btnBg}}; color: {{btnInk}}; font-size: 19px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; border: 2px solid {{btnEdge}};">{{btnLabel}}</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "state": {"editor": "select", "options": ["choosing", "recorded", "coerced"], "default": "recorded", "section": "Ballot"},
  "clock": {"editor": "text", "default": "22s", "section": "Ballot"}
}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'recorded';
    const picked = state === 'choosing' ? -1 : (state === 'coerced' ? 2 : 0);
    const raw = [
      { seat: '4', name: 'Sam', sub: 'named by Ellie', accent: '#d95a8a' },
      { seat: '7', name: 'Mary-Kate 3', sub: 'named by John', accent: '#7fb3e8' },
      { seat: '—', name: 'No one', sub: 'let them all live', accent: '#8a7d70' },
    ];
    const rec = {
      choosing: { kicker: 'Not sent', line: 'Pick one. You can change it.', tint: '#8a7d70', bg: '#161310' },
      recorded: { kicker: 'The room recorded', line: 'Your vote: SAM (seat 4)', tint: '#9ff2c8', bg: 'rgba(159,242,200,.08)' },
      coerced:  { kicker: 'The room recorded', line: 'You cannot vote for yourself — counted as NO ONE', tint: '#ff8a7a', bg: 'rgba(255,138,122,.10)' },
    }[state];
    return {
      clock: this.props.clock ?? '22s',
      recKicker: rec.kicker, recLine: rec.line, recTint: rec.tint, recBg: rec.bg,
      btnLabel: state === 'choosing' ? 'Send ballot' : 'Change my vote',
      btnBg: state === 'choosing' ? '#f5a14a' : 'transparent',
      btnInk: state === 'choosing' ? '#0c0a08' : '#f3ece3',
      btnEdge: state === 'choosing' ? '#f5a14a' : 'rgba(245,161,74,.55)',
      options: raw.map((o, i) => ({
        seat: o.seat, name: o.name, sub: o.sub, accent: o.accent,
        mark: i === picked ? '●' : '',
        markTint: rec.tint,
        bg: i === picked ? 'rgba(245,161,74,.10)' : '#161310',
        edge: i === picked ? rec.tint : 'rgba(245,161,74,.12)',
      })),
    };
  }
}
</script>
</body>
</html>
