<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Prime Time</title>
<!--
  📱 THE CONTROLLER. Under D13 the runner's view is on the television, so the phone is never a
  window into the game — it is the private half: your card, and the four taps only you can make.

  🚨 THE CARD IS HOLD-TO-REVEAL, WHICH IS `rrr-phone-ux.md` §2.3 VERBATIM: *"the card is blurred
  until a finger is held on it, so a neighbour's glance at an unattended phone reveals nothing.
  Releasing re-blurs after 400 ms."* This shipped as the doc's own *cheap v1* — tap to open, tap to
  close — and the comment here defended that as the design, which it never was. A tap-to-open card
  is readable by the person beside you for exactly as long as its owner is distracted, and eight
  people on a sofa is a room built out of distraction. A held finger is a card nobody else can read
  and nobody can forget to put away.

  🚨 THIS PAGE IS NOT TOLD WHAT IT IS NOT ENTITLED TO. There is no filtering here and there must
  never be — `project()` on the server decides, and the fields simply are not in the frame. If a
  future version hides something in CSS, that secret is one "inspect element" from the table.

  ⚠️ NO WAKE LOCK, SAME AS THE SPIKE. A phone that locks and comes back to its own seat is the
  thing being tested; suppressing the lock would answer the question by preventing it.
-->
<style>
  :root{ --ink:#f2f4f8; --dim:#8b93a3; --bg:#0b0d12; --panel:#161b25; --edge:#262d3d;
         --live:#4cc27a; --gone:#e4483a; --warn:#e0b23c; --evil:#e4483a; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 17px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
       display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 14px
       calc(14px + env(safe-area-inset-bottom));overscroll-behavior:none}
  .bar{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.1em;color:var(--dim);
       text-transform:uppercase;font-variant-numeric:tabular-nums}
  .bar .sw{width:14px;height:14px;border-radius:50%;flex:none}
  .bar .me{color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0;font-size:15px}
  .bar .rt{margin-left:auto}
  .bar.down{color:var(--gone)}

  .phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .phase h2{font:700 22px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .phase .t{font:700 22px/1 ui-monospace,Menlo,monospace;color:var(--warn);font-variant-numeric:tabular-nums}

  .card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px}
  .card h3{font:600 12px/1 ui-sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
  .say{color:var(--dim);font-size:15px;line-height:1.5}

  /* 🚨 60px MINIMUM. A thumb-miss during a nomination is a vote for the wrong person. */
  button{width:100%;min-height:60px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);
         border:1px solid var(--edge);font:600 18px/1.2 inherit;padding:12px;display:flex;align-items:center;gap:10px;
         justify-content:flex-start;text-align:left;margin-top:8px}
  button.big{justify-content:center;font:700 22px/1 inherit;letter-spacing:.08em;min-height:76px}
  button.go{background:var(--live);color:#06170d;border-color:transparent}
  button.stop{background:var(--warn);color:#171203;border-color:transparent}
  button.kill{background:var(--gone);color:#1a0605;border-color:transparent}
  button.on{outline:3px solid var(--warn);outline-offset:-3px}
  button:disabled{opacity:.35}
  button .sw{width:20px;height:20px;border-radius:50%;flex:none}
  /* 🚨 THE SWATCH CARRIES THE SEAT NUMBER, NOT JUST A HUE — §6, *"no information anywhere is
     carried by hue alone"*. The seat palette has measured deuteranope confusions at ΔE2000 3.3
     (seat 2 vs seat 5) and 4.6 (seat 6 vs seat 7), which is the same colour; and three guests all
     called "Sam" is a real table, at which point the dot is the only discriminator there is.
     The number is the one the television draws inside its own dot, so the two screens agree. */
  .sw{display:flex;align-items:center;justify-content:center;font:700 12px/1 ui-sans-serif;
      color:#0b0d12;font-variant-numeric:tabular-nums}
  .bar .sw{font-size:11px}
  input{width:100%;background:#0d1017;border:1px solid var(--edge);border-radius:12px;color:var(--ink);
        font:600 20px/1.2 inherit;padding:14px;outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .two button{margin-top:0}
  .hide{display:none!important}
  .note{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.45}
  /* 🚨 THE DARK CARD — round §1's phase table, the `Phones` column, where three rows read "dark". */
  .down{font:700 26px/1.15 ui-sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center;
        color:var(--dim);padding:26px 8px 8px}
  .down + .say{text-align:center;padding-bottom:22px}
  .warn{color:var(--warn)} .bad{color:var(--gone)} .good{color:var(--live)}
  /* the nameplate rail — round §1's phase table gives DEBRIEF "claims/nameplates only" */
  .plate{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--edge)}
  .plate:last-of-type{border-bottom:0}
  .plate .sw{width:18px;height:18px;border-radius:50%;flex:none;align-self:center;font-size:11px}
  .plate .say{margin-left:auto;font-style:italic;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* the card */
  .role{font:700 34px/1.1 ui-sans-serif;margin-bottom:6px}
  /* §2.3: "one line of rule text at 24 px". The card's own words, above the team sentence. */
  .line{font:500 24px/1.35 ui-sans-serif;color:var(--ink);margin-bottom:14px}
  .align{font:600 12px/1 ui-sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .mates{margin-top:14px;border-top:1px solid var(--edge);padding-top:12px}
  .mates .m{display:flex;gap:8px;align-items:baseline;font-size:16px;margin-top:6px}
  /* Continuity's dossier. Sized like the Production Panel because it is the same KIND of thing —
     the only other block on any phone that nobody else in the room can see. */
  .dossier{margin-top:18px;border-top:1px solid var(--edge);padding-top:14px}
  .dossier h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    font-weight:600;margin-bottom:10px}
  .dossier .r{display:flex;gap:10px;align-items:baseline;font-size:16px;margin-top:8px;
    line-height:1.35}
  .dossier .ep{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    flex:0 0 46px;padding-top:2px}
  .dossier .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dossier .yes{color:var(--warn);font-weight:700}
  .dossier .no{color:var(--dim);font-weight:700}
  .dossier .note{color:var(--dim);font-size:13px;line-height:1.5;margin-top:12px}
  .mates .m b{color:var(--evil)}
  .flag{position:fixed;inset:0;background:var(--bg);z-index:9;padding:28px 20px;display:flex;
        flex-direction:column;justify-content:center;gap:18px;touch-action:none}
  /* §2.3. The blur is the resting state and `lit` is the exception, so a script that never runs
     leaves the card unreadable rather than open — the safe direction to fail in. */
  #cardFace{filter:blur(16px);transition:filter .16s ease;user-select:none;-webkit-user-select:none}
  .flag.lit #cardFace{filter:none}
  .holdnote{font:600 13px/1.4 ui-sans-serif;letter-spacing:.18em;text-transform:uppercase;
            color:var(--dim);text-align:center}
  .flag.lit .holdnote{color:var(--live)}

  /* 🚨 OFF AIR — the banner `act()` raises when a tap cannot leave the phone. It is deliberately
     the loudest thing on the screen and deliberately NOT the top strip: the strip already says
     `reconnecting…` at 13px in the same slot that normally says `connected`, and a player who has
     just tapped a name is not reading the strip. */
  .offair{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;
          background:var(--gone);color:#1a0605;border-radius:14px;padding:12px 14px;text-align:center;
          font:600 17px/1.3 ui-sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  .offair b{display:block;font:700 13px/1.5 ui-sans-serif;letter-spacing:.16em;text-transform:uppercase}
</style>

<div class="bar" id="bar">
  <span class="sw" id="sw"></span><span class="me" id="me">…</span>
  <span id="state">connecting…</span><span class="rt" id="rt"></span>
</div>

<!-- lobby -->
<div class="card" id="joinCard">
  <h3>Your robot's name</h3>
  <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="ROBOT">
  <button class="big stop" id="go">Take a seat</button>
  <div class="note" id="joinNote">Same wifi, nothing installs. The show starts on the TV.</div>
</div>

<!-- playing -->
<div id="play" class="hide">
  <div class="phase"><h2 id="ph">—</h2><span class="t" id="clock"></span></div>
  <div class="card" style="margin-top:12px"><div class="say" id="say">…</div></div>
  <div id="controls"></div>
  <!-- §2.3's persistent ROLE tab: it reopens the card in any phase, and it is never a reveal. -->
  <button id="cardBtn" style="margin-top:14px">🎴 <span>Your card — hold to read</span></button>
  <div class="note" id="refused"></div>
</div>

<!-- 🚨 A TAP THAT COULD NOT BE SENT SAYS SO. `act()` raises this; nothing else touches it. -->
<div class="offair hide" id="offair"></div>

<!-- the card, full screen, blurred until a finger is held on it — §2.3 -->
<div class="flag hide" id="cardView">
  <div id="cardFace">
    <div class="align" id="cardAlign">You are</div>
    <div class="role" id="cardRole">—</div>
    <div class="say" id="cardSay"></div>
    <div class="mates hide" id="cardMates"></div>
    <div class="dossier hide" id="cardReadings"></div>
  </div>
  <div class="holdnote" id="holdNote">Hold anywhere to read</div>
  <button class="big" id="cardClose">Close</button>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const CODE = (location.search.match(/[?&]c=([a-z0-9]+)/i) || [, 'show'])[1];
  const KEY = 'rrr.show.token.' + CODE, NKEY = 'rrr.show.name.' + CODE;

  let ws = null, seat = null, frame = null, me = null, backoff = 500, wantJoin = false, reported = false;
  /**
   * 🚨 THE WHOLE ROSTER, NOT JUST MY OWN SEAT. The `roster` message has always carried a colour
   * for every player and this page kept only its own, so every swatch on every sheet except the
   * bar at the top drew `#8b93a3` — and a grey dot beside a name is not neutral, it is a phone
   * and a television DISAGREEING about who is who in a game where the nameplate rail is how you
   * refer to people out loud. Same array the TV draws its circle from, same colours.
   */
  let roster = [];
  let pickRunner = null, pickGuide = null, lastPhase = null, myVote = null;

  $('name').value = localStorage.getItem(NKEY) || '';
  $('go').onclick = () => {
    wantJoin = true;
    localStorage.setItem(NKEY, $('name').value.trim());
    $('go').disabled = true; $('go').textContent = 'Taking a seat…';
    if (ws && ws.readyState === 1) join();
  };
  // ---------------------------------------------------------------- the card, held
  /**
   * 🚨 §2.3, AND THE 400 ms IS THE SPEC'S NUMBER RATHER THAN A FEEL ONE. *"Releasing re-blurs
   * after 400 ms."* The delay exists so a finger that slips off the glass mid-read does not snap
   * the card shut, which would train people to press harder and longer — the opposite of what
   * this is for.
   *
   * ⚠️ POINTER EVENTS, NOT `touchstart`, AND `setPointerCapture` IS WHAT MAKES RELEASE RELIABLE.
   * Without capture a finger that drifts off the element never delivers `pointerup` to it, and
   * the card stays lit on a phone lying face-up on a sofa arm — precisely the failure the blur
   * exists to prevent.
   */
  let reblur = null;
  const lit = (on) => {
    clearTimeout(reblur);
    if (on) return $('cardView').classList.add('lit');
    reblur = setTimeout(() => $('cardView').classList.remove('lit'), 400);
  };
  $('cardBtn').onclick = () => { showCard(); lit(false); $('cardView').classList.remove('hide'); };
  $('cardClose').onclick = (e) => { e.stopPropagation(); lit(false); $('cardView').classList.add('hide'); };
  $('cardView').addEventListener('pointerdown', (e) => {
    if (e.target.id === 'cardClose') return;
    e.preventDefault();
    try { $('cardView').setPointerCapture(e.pointerId); } catch (_) {}
    lit(true);
  });
  for (const ev of ['pointerup', 'pointercancel']) $('cardView').addEventListener(ev, () => lit(false));

  /**
   * 🚨 **A TAP THAT CANNOT LEAVE THE PHONE IS HELD AND SAID OUT LOUD — IT USED TO EVAPORATE.**
   *
   * This was `ws && ws.readyState === 1 && ws.send(…)`, and when that short-circuited **nothing
   * happened at all**: no disabled state, no queue, no message, and the controls stayed fully
   * enabled and fully interactive. The only sign was the top strip changing from `connected` to
   * `reconnecting…` — 13px, uppercase, in the same slot, above a screen the player is not looking
   * at, because they are looking at the name they just tapped.
   *
   * The trace this comes from: a screen locks during the 75-second DEBRIEF, the player picks it up
   * as the VOTE opens, there is half a second of dead socket, they tap a name, nothing visible
   * happens, they tap again. It lands on the one action in the game with a hard 25-second deadline
   * and no second chance.
   *
   * So the tap is **kept** — one of them, the most recent, because a controller that replays a
   * queue is worse than one that drops it — and it goes the instant the seat is back. Two rules
   * bound it, and both exist so a held tap can never become a tap somebody did not make:
   *
   *   · **the phase must not have moved.** A `vote` composed in the VOTE and delivered in the
   *     EXECUTION is a different act. The server would refuse it anyway; the phone must not have
   *     asked.
   *   · **and it expires.** `HOLD_MS` is one phase's worth of patience, not the evening's.
   *
   * Either way `#offair` says which happened, because the failure this replaces was silent.
   */
  const HOLD_MS = 20000;
  let held = null;

  function act(msg) {
    if (wireLive()) { ws.send(JSON.stringify({ t: 'act', msg })); return true; }
    held = { msg, phase: frame && frame.phase, at: Date.now() };
    offair();
    return false;
  }

  function flushHeld() {
    if (!held || !wireLive()) return;
    const h = held;
    held = null;
    if (h.phase !== (frame && frame.phase) || Date.now() - h.at > HOLD_MS) {
      $('refused').innerHTML = '<span class="warn">Your ' + esc(h.msg.t)
        + ' never left this phone — it was off air, and the moment passed. Say it out loud.</span>';
    } else {
      ws.send(JSON.stringify({ t: 'act', msg: h.msg }));
    }
    offair();
  }

  /** The banner. Raised by `act()`, lowered by the watchdog the moment the wire is back. */
  function offair() {
    const box = $('offair'), down = !wireLive();
    box.classList.toggle('hide', !down);
    if (!down) { box.innerHTML = ''; return; }
    box.innerHTML = held
      ? '<b>Off air — your tap is held</b>It goes the moment this phone is back. Nothing is lost.'
      : '<b>Off air</b>Nothing you tap can leave this phone yet.';
  }

  function join() {
    ws.send(JSON.stringify({
      t: 'join', name: ($('name').value.trim() || '').slice(0, 14),
      token: localStorage.getItem(KEY) || null,
      boot: reported ? null : Math.round(performance.now()),
      ua: navigator.userAgent,
    }));
    reported = true;
  }

  // ---------------------------------------------------------------- the card
  /**
   * 🚨 ALIGNMENT COMES FROM `you.alignment`, WHICH WAS SITTING IN THE FRAME UNREAD WHILE THIS
   * INFERRED IT FROM `Array.isArray(you.teammates)`. At 6-8 players there are two in Production so
   * the array is non-empty and the guess held. At 4-5 there is exactly ONE — the array is empty,
   * `project()`'s prune legitimately deletes an empty array from the frame, and the sole traitor's
   * own phone told them they were GOOD. Not a display bug: a player who reads that card plays the
   * whole evening for the other side.
   *
   * ⚠️ AND THE WORD IS SPELLED OUT, NEVER COLOUR ALONE — §2.3, and §6's accessibility rule. Red
   * text on a black card in a dark lounge is not a message, it is a hint.
   */
  /**
   * 🚨 THE CARD SAYS WHAT THE ROLE IS. It printed `you.role` raw, so players read `focusPuller`,
   * `theStatic` and `methodActor` off their own cards — object keys, from a `SCRIPT` that has
   * carried a display name and a one-line ability for every card since it was written and was
   * imported once in the whole tree, unused. §2.3 wants *"one line of rule text at 24 px, the role
   * name at 34 px, and the word GOOD or PRODUCTION spelled out"*; that is three fields and the
   * page had one of them. `roleName` and `roleLine` are `self` rows — a line naming what you learn
   * each episode names a role as surely as the key does.
   *
   * ⚠️ AND THE LINE IS ONLY THE LINE. Nothing here makes an ability fire; the card is a card.
   */
  function showCard() {
    const you = (frame && frame.you) || {};
    const evil = you.alignment === 'evil';
    $('cardRole').textContent = you.roleName || you.role || '—';
    $('cardAlign').textContent = evil ? 'You are PRODUCTION' : 'You are GOOD';
    const line = you.roleLine ? '<div class="line">' + esc(you.roleLine) + '</div>' : '';
    $('cardSay').innerHTML = line + (evil
      ? '<span class="bad">You are Production.</span> Your job is to lose the show without ever being the reason.'
      : 'Light the cameras. Nobody will tell you if you are right.');
    const mates = $('cardMates');
    // The Production Panel is the one exception in the whole matrix, and it exists only here.
    if (evil && you.teammates.length) {
      mates.classList.remove('hide');
      mates.innerHTML = '<h3>Production</h3>' + you.teammates.map((m) =>
        '<div class="m"><b>' + esc(nameOf(m.id)) + '</b><span class="say">' + esc(m.role) + '</span></div>').join('');
    } else { mates.classList.add('hide'); mates.innerHTML = ''; }
    showReadings();
  }

  /**
   * 🚨 **THE FIRST PRIVATE INFORMATION ON THIS PAGE THAT IS NOT THE CARD ITSELF.** Until
   * Continuity started firing, the entire private wire was one `role.card` per player, dealt in
   * episode one — `party-private` measured it at one envelope per player per whole five-episode
   * game. A reading that reached the frame and appeared on no screen would be the same bug in a
   * new place, and `wire-parity` P4b could not have caught it: it compares TOP-LEVEL frame keys,
   * and `you` is already read by this page.
   *
   * ⚠️ THE PAIR IS NAMED, AND THAT IS THE WHOLE VALUE. "NO" on its own is a fact that expires
   * the moment the episode does. *"Episode 2, Ana and Ben, no Production"* is a dossier entry the
   * holder can still spend in episode 5 — and can still be caught lying about at the Reunion.
   *
   * ⚠️ AND NOTHING HERE SAYS WHETHER A READING WAS POISONED, because nothing on the wire does.
   * `resolveInformation` computes it and `session.js` throws it away: a holder who could see
   * their own reading falsified would know they are the Glitched. The copy below is deliberately
   * written to sit correctly on a poisoned dossier — it says what the reading SAID, never that
   * it is true.
   */
  function showReadings() {
    const el = $('cardReadings');
    const rs = (frame && frame.you && frame.you.readings) || [];
    if (!rs.length) { el.classList.add('hide'); el.innerHTML = ''; return; }
    el.classList.remove('hide');
    el.innerHTML = '<h3>What you have learned</h3>'
      + rs.map((r) => '<div class="r">'
          + '<span class="ep">Ep ' + esc(String(r.episode)) + '</span>'
          + '<span class="who">' + esc(nameOf(r.runner)) + ' &amp; ' + esc(nameOf(r.guide)) + '</span>'
          + (r.value ? '<span class="yes">PRODUCTION</span>' : '<span class="no">CLEAR</span>')
        + '</div>').join('')
      + '<div class="note">Nobody else has this. Nobody else can check it.</div>';
  }

  const nameOf = (id) => { const p = ((frame && frame.players) || []).find((x) => x.id === id); return p ? p.name : id; };
  const living = () => ((frame && frame.players) || []).filter((p) => p.alive);
  const iAm = () => (frame && frame.you && frame.you.id) || null;
  const amRunner = () => frame && frame.pair && frame.pair.runner === iAm();
  const amGuide = () => frame && frame.pair && frame.pair.guide === iAm();
  const alive = () => { const p = ((frame && frame.players) || []).find((x) => x.id === iAm()); return !p || p.alive; };

  // ---------------------------------------------------------------- the controls
  const SAY = {
    PREMIERE: 'Read your card, then put the phone down. Everything after this happens out loud.',
    CASTING: () => 'Who goes into ' + wing() + '? Two taps: your runner first, then your guide.',
    EXPEDITION: () => amGuide() ? 'You can see what the cameras can see. Tell them.'
      : amRunner() ? 'Your guide is looking. Then it is your call.'
      : 'Watch the television.',
    RECAP: 'Phones down. Watch the television.',
    DEBRIEF: 'Talk. Out loud, to the room. A nameplate is the only thing you can put in writing.',
    RECKONING: 'Nominate once, or keep it. Three stand at most.',
    VOTE: 'More than half the living, or nobody swings. Abstaining protects them.',
    EXECUTION: 'Nobody says what they were.',
    VERDICT: 'Phones down. Watch the television.',
    REUNION: 'It is over. Look up.',
  };

  /**
   * 🚨 **THE CONTROLS ARE BUILT ONCE PER SHEET AND UPDATED AFTER THAT. THEY USED TO BE DESTROYED
   * AND REBUILT ON EVERY FRAME, AND THAT ATE ROUGHLY HALF THE GUIDE'S TAPS.**
   *
   * Measured, in Chromium, against a real `show.mjs`: during a wired expedition the **guide's**
   * phone receives one `state` frame per simulator report at 5 Hz — **450 frames in 90 seconds**,
   * while every other phone in the room receives only pings. `render()` ran on every one of them
   * and every branch below began `box.innerHTML = …`, so the `<canvas id="map">` and the
   * `CLEAR`/`HOLD` buttons were thrown away and remade 450 times per expedition. Two costs:
   *
   *   · `drawMap` reallocated the canvas backing store 450 times (measured: 50 writes over 50
   *     frames, one per frame, every one of them a fresh allocation and a clear).
   *   · **a `pointerdown` on CLEAR and a `pointerup` ~100 ms later landed on different DOM nodes.**
   *     The browser then fires `click` on the common ancestor — or, when the pressed node is gone,
   *     fires nothing at all — and no handler runs. Measured: a press, one frame, a release, and
   *     the server heard **nothing** (`call.said = null`); the identical press with no frame
   *     between it and the release was heard as `HOLD`. With a 200 ms rebuild period and a ~100 ms
   *     tap that is about half of every CLEAR and HOLD, silently, with no feedback of any kind.
   *
   * The same measurement on the casting ballot: **8 of 8** taps landed with no frame mid-tap and
   * **0 of 8** landed when another player's ballot arrived between the press and the release.
   *
   * So a sheet declares a **structural key**. The key changes when the sheet's SHAPE changes — a
   * map appears, the call has been made, a chair has been spent, the list of the living changes —
   * and only then is the DOM rebuilt. Every other frame runs the sheet's own `update`, which
   * writes text and classes into nodes that keep their identity for as long as the player can see
   * them. A tap that starts on a button ends on the same button.
   *
   * ⚠️ THE KEY MUST COVER EVERYTHING THE HTML BRANCHES ON, or a sheet goes stale — which is the
   * failure mode a rebuild-everything render can never have and this one can. Each key below is
   * built beside the html it guards, from the same values, for exactly that reason.
   */
  let sheetKey = null, sheetUpdate = null, sheetDrop = null;

  function mount(key, html, wire) {
    if (key === sheetKey && sheetUpdate) { sheetUpdate(); return; }
    if (sheetDrop) { sheetDrop(); sheetDrop = null; }
    sheetKey = key;
    $('controls').innerHTML = html();
    sheetUpdate = (wire && wire()) || null;
    if (sheetUpdate) sheetUpdate();
  }

  /** The Reunion writes `#controls` directly, so the sheet under it has to be forgotten. */
  function dropSheet() {
    if (sheetDrop) { sheetDrop(); sheetDrop = null; }
    sheetKey = null; sheetUpdate = null;
  }

  /** §2.11's window: whether the refuse button is on this sheet at all is a structural fact. */
  const refuseKey = () => (refuseCard() ? 'refuse' : 'spent');

  function controls() {
    if (!alive()) {
      // C1: the dead get the chat and the Reunion. No ghost UI, by design.
      return mount('dead', () => '<div class="card"><div class="say">You are out. You keep your voice and nothing else — '
        + 'no vote, no nominations. Stay in the room; the Reunion is coming.</div></div>');
    }
    const p = frame.phase;

    /**
     * 🚨 SEQUENTIAL, ONE LIST — round §2, in its own words: *"Every living player makes exactly two
     * taps: first tap = their runner pick, second tap = their guide pick."* This shipped as two
     * separate labelled lists, which is a different ballot: it asks the table to hold two parallel
     * questions at once, and it puts the same eight names on screen twice on a 390px phone, so the
     * guide list is below the fold and half the room never scrolls to it.
     *
     * 🚨 THE SUBMIT IS ATOMIC AND THAT IS THE POINT OF THE BUTTON. Two taps that each sent a
     * message would let the bell catch a ballot with a runner and no guide — a half-vote nobody
     * cast, scoring one person and not the other. `CONFIRM PAIR` sends both picks in one message
     * or sends nothing, so the ballot the server tallies is always a ballot somebody finished.
     *
     * ⚠️ AND THE TWO TAPS ARE THE REASON THIS SHEET IS KEYED ON THE LIVING AND NOTHING ELSE. The
     * heading, the chair badges, the flattening and the button's own label all move on a pick —
     * every one of them a text or a class, none of them a node. The ballot is rebuilt when
     * somebody DIES, and at no other time.
     */
    if (p === 'CASTING') {
      return mount('cast|' + living().map((x) => x.id).join(','),
        () => '<div class="card"><h3 id="castHead"></h3>' + castButtons() + '</div>'
          + '<button class="big stop" id="sendCast"></button>'
          + '<div class="note">Two taps: the first is who runs, the second is who guides. '
          + 'Nothing is sent until you confirm — and nobody sees your ballot until the bell.</div>',
        () => {
          for (const b of $('controls').querySelectorAll('[data-pick]')) {
            b.onclick = () => {
              const id = b.dataset.pick.split('|')[1];
              if (pickRunner === id) pickRunner = null;
              else if (pickGuide === id) pickGuide = null;
              else if (!pickRunner) pickRunner = id;
              else if (!pickGuide) pickGuide = id;
              controls();
            };
          }
          // One message, both picks, or no message at all.
          $('sendCast').onclick = () => { if (pickRunner && pickGuide) act({ t: 'cast', runner: pickRunner, guide: pickGuide }); };
          return () => {
            const full = !!(pickRunner && pickGuide);
            $('castHead').textContent = pickRunner ? (full ? 'Your pair' : 'Now your guide') : 'First, your runner';
            for (const b of $('controls').querySelectorAll('[data-pick]')) {
              const id = b.dataset.pick.split('|')[1];
              const role = pickRunner === id ? 'RUNNER' : pickGuide === id ? 'GUIDE' : null;
              b.classList.toggle('on', !!role);
              // A name already taken stays live so it can be given back; every other name goes
              // flat once both chairs are full — §2.6's most expensive input error.
              b.disabled = full && !role;
              paintPerson(b, id, role ? '▶ ' + role : null, !!role);
            }
            const send = $('sendCast');
            send.disabled = !full;
            send.textContent = (frame.you && frame.you.acted) ? 'Change your pair' : 'Confirm pair';
          };
        });
    }

    if (p === 'EXPEDITION') {
      if (amGuide()) {
        const f = frame.flyover || {};
        // 🚨 THE READING IS SHOWN EXACTLY AS IT ARRIVES, INCLUDING THE ABSENCE. "No signal" is not
        // an error state — it is a guide who genuinely does not know, and it is the only reason
        // a lie and an honest mistake look the same from the sofa.
        // The map, when the house is real. Marks and the floor plan arrive together and only for
        // a socket the matrix entitles — this page does no filtering and must never start.
        const hasMap = !!(f.plan && f.plan.length);
        const called = !!(frame.call && frame.call.said);
        // 🚨 THE KEY, AND EVERY TERM IN IT IS A SHAPE. Whether there is a map, whether the buttons
        // have been replaced by what you said, and whether the chair is still refusable. The
        // reading itself — HUNTER or NO SIGNAL, and which room — is text, so it is an update, and
        // that is what keeps CLEAR and HOLD alive under 450 frames.
        return mount('guide|' + (hasMap ? 'map' : 'blind') + '|' + (called ? 'said' : 'open') + '|' + refuseKey(),
          () => '<div class="card"><h3>Your cameras</h3>'
            + (hasMap ? '<canvas id="map" style="width:100%;aspect-ratio:4/3;background:#0d1017;border-radius:12px;margin-bottom:10px"></canvas>' : '')
            + '<div class="big" id="read" style="font:700 26px/1 ui-sans-serif"></div>'
            + '<div class="note" id="readNote"></div></div>'
            + (called
              ? '<div class="card" style="margin-top:10px"><div class="say">You called <b id="saidWord"></b>.</div></div>'
              : '<div class="two" style="margin-top:10px">'
                + '<button class="big go" id="cl">CLEAR</button><button class="big stop" id="hd">HOLD</button></div>')
            + refuseCard(),
          () => {
            if ($('cl')) { $('cl').onclick = () => act({ t: 'call', call: 'CLEAR' }); $('hd').onclick = () => act({ t: 'call', call: 'HOLD' }); }
            wireRefuse();
            return () => {
              const g = frame.flyover || {};
              const read = $('read');
              read.className = 'big' + (g.hunter ? ' bad' : '');
              read.style.color = g.hunter ? '' : 'var(--dim)';
              // 🚨 AND THE ROOM IS NAMED THE WAY THE ROOM IS NAMED. This printed `f.room` raw, so
              // the guide's own screen — the one private reading in the game — said
              // `HUNTER — study_w` while the television beside it said THE WEST STUDY. Same
              // `ROOM_LABEL` this page already carries for `wing()`; same fix as the television's.
              read.textContent = g.hunter ? 'HUNTER — ' + (ROOM_LABEL[g.room] || g.room || '?') : 'NO SIGNAL';
              $('readNote').textContent = g.hunter ? 'A live camera has it.'
                : 'Nothing in ' + wing() + '. That is not the same as empty.';
              if ($('saidWord')) $('saidWord').textContent = (frame.call && frame.call.said) || '';
              drawMap(g);
            };
          });
      }
      if (amRunner()) {
        // 🚨 THE RUNNER IS NOT SHOWN THE WORD, AND THAT IS BROADCAST §6.9 RATHER THAN AN OMISSION.
        // *"The guide talks out loud, in the room. That is the game."* The phone knows only that
        // the guide has spoken — `call.said` is not on this frame at all — so GO and WAIT unlock
        // on a fact about the clock, and what to do about it is something the runner has to have
        // heard, and can later be argued with about having heard.
        const said = frame.call && frame.call.made;
        // 🚨 A LIVE HOUSE MEANS A THROTTLE, NOT A BUTTON. With the mansion attached the runner's
        // decision is not "go or wait" once — it is a speed, continuously, against a Hunter that
        // hears them. `player.js:638` is `noise = speed / MOVE.run`, so the ring under the stick
        // IS the noise, and choosing RUN while it is close is loud, on camera, and completely
        // deniable as panic. That is the runner's whole dual-use verb under D13.
        if (frame.expedition && frame.expedition.live && said) {
          // 🚨 AND THE DRIVE SHEET IS THE ONE THAT MUST BE TORN DOWN, NOT JUST REPLACED — see
          // `stopDrive()`. The stick's timer outlived the expedition by the whole rest of the show.
          return mount('drive', driveCard, () => {
            wireDrive();
            sheetDrop = stopDrive;
            return paintDetents;
          });
        }
        return mount('run|' + (said ? 'said' : 'wait') + '|' + (frame.you && frame.you.acted ? 'locked' : 'open') + '|' + refuseKey(),
          () => (said
            ? '<div class="card"><h3>' + esc(nameOf(frame.pair && frame.pair.guide)) + ' has called it</h3>'
              + '<div class="say">Out loud, to the room. Nothing on this phone will repeat it.</div>'
              + '<div class="note">Waiting costs the camera. It does not cost you.</div></div>'
              + (frame.you && frame.you.acted
                ? '<div class="card" style="margin-top:10px"><div class="say">Locked in.</div></div>'
                : '<div class="two" style="margin-top:10px"><button class="big go" id="gogo">GO</button>'
                  + '<button class="big" id="wait">WAIT</button></div>')
            : '<div class="card"><div class="say">Waiting for your guide.</div></div>') + refuseCard(),
          () => {
            if ($('gogo')) { $('gogo').onclick = () => act({ t: 'move', move: 'GO' }); $('wait').onclick = () => act({ t: 'move', move: 'WAIT' }); }
            wireRefuse();
            return null;
          });
      }
      return claimSheet();
    }

    if (p === 'RECKONING') {
      const acted = frame.you && frame.you.acted;
      return mount('nom|' + (acted ? 'done' : living().filter((x) => x.id !== iAm()).map((x) => x.id).join(',')),
        () => (acted
          ? '<div class="card"><div class="say">Your nomination stands. One each.</div></div>'
          : '<div class="card"><h3>Nominate</h3>' + peopleButtons('n', true) + '</div>'),
        () => {
          for (const b of $('controls').querySelectorAll('[data-pick]')) {
            b.onclick = () => act({ t: 'nominate', target: b.dataset.pick.split('|')[1] });
          }
          return () => { for (const b of $('controls').querySelectorAll('[data-pick]')) paintPerson(b, b.dataset.pick.split('|')[1]); };
        });
    }

    /**
     * 🚨 THE VOTE SHEET TAKES TAPS TOO, AND IT WAS REBUILT EVERY TIME ANYBODY ELSE VOTED. Eight
     * living players is up to eight rebuilds inside a 25-second window with no clock stop, each
     * one able to swallow a tap that straddles it. Same key, same reason: the nominations are the
     * shape and everything else is text.
     *
     * ⚠️ AND YOUR OWN CHOICE IS NOW SHOWN, LOCALLY, THE INSTANT YOU TAP IT — §5, *"each shows a
     * local pressed/pending state instantly"*. Nothing is revealed to anybody: the server has
     * always known who you voted for and the television still shows nothing until the bell. What
     * changes is that a tap on this sheet now looks like a tap.
     */
    if (p === 'VOTE') {
      const noms = frame.nominations || [];
      if (!noms.length) return mount('vote|none', () => '<div class="card"><div class="say">Nobody was nominated. Nothing to vote on.</div></div>');
      return mount('vote|' + noms.map((n) => n.target + '<' + n.nominator).join(','),
        () => '<div class="card"><h3>Execute</h3>'
          + noms.map((n) => '<button data-vote="' + esc(n.target) + '">'
            + swatch(n.target) + esc(nameOf(n.target))
            + '<span class="say" style="margin-left:auto">by ' + esc(nameOf(n.nominator)) + '</span></button>').join('')
          + '<button data-vote="NO_ONE">Abstain — protect them all</button>'
          + '<div class="note">You can change it until the clock runs out. Nothing is shown until then.</div></div>',
        () => {
          for (const b of $('controls').querySelectorAll('[data-vote]')) {
            b.onclick = () => { myVote = b.dataset.vote; act({ t: 'vote', choice: b.dataset.vote }); controls(); };
          }
          return () => {
            for (const b of $('controls').querySelectorAll('[data-vote]')) b.classList.toggle('on', myVote === b.dataset.vote);
          };
        });
    }

    /**
     * 🚨 THREE PHASES ARE DARK AND THE PHONE HAD CONTROLS ON ALL THREE. Round §1's phase table has
     * a `Phones` column and it reads **dark** for RECAP, EXECUTION and VERDICT; bible **P2** says
     * why in one line: *"After an Expedition, crew phones go dark: no logs, no replay, no notes.
     * What you remember and can convince the room of is the only record."* What shipped was the
     * claim text box on every phase that had nothing else to show — a keyboard, on eight phones,
     * during the twenty seconds the recap reel is playing.
     *
     * ⚠️ AND THE CLAIM BOX IS THE WORST THING TO PUT THERE, NOT A HARMLESS DEFAULT. It hands the
     * guide twenty idle seconds holding a PRODUCIBLE alibi — a written, timestamped, publishable
     * story composed while the evidence is still on screen — which attacks the one unwitnessed
     * asset the whole deduction rests on (D13). A map here would be worse still and was the
     * earlier advice; this reverses it.
     *
     * The ROLE tab stays, because §2.3 makes it persistent *"in any phase"* and it is hold-to-
     * reveal, so it is a thing you can check rather than a thing left on screen. Nothing else.
     */
    if (DARK.includes(p)) {
      return mount('dark|' + p, () => '<div class="card"><div class="down">Phones down — talk</div>'
        + '<div class="say">' + esc(DARK_SAY[p]) + '</div></div>');
    }

    // 🚨 PREMIERE IS THE CARD AND NOTHING ELSE. It fell through to the claim plate, so a
    // first-time player's first sight of the game was a text box and a permanent public Publish
    // button, above the button that shows them who they are.
    if (p === 'PREMIERE') return mount('premiere', premiereCard);

    return claimSheet();
  }

  /** Round §1's phase table, `Phones` column: the rows that read "dark". */
  const DARK = ['RECAP', 'EXECUTION', 'VERDICT'];
  const DARK_SAY = {
    RECAP: 'The recap is on the television. Nothing on this phone will remember it for you.',
    EXECUTION: 'Nobody says what they were.',
    VERDICT: 'Cameras and incidents, on the television.',
  };

  // ---------------------------------------------------------------- the guide's map
  /**
   * 🚨 THE MAP DRAWS WHAT ARRIVED AND NOTHING MORE. If `marks` holds no hunter, the guide does not
   * know where it is — there is no last-known ghost drawn here, no decayed blob, no "probably
   * around here". `darkrun.js` has a `ghost()` for that and it is deliberately not wired: an
   * honest guide who cannot see must have nothing to point at, or the deniable mistake the whole
   * design rests on stops being available to them.
   */
  function drawMap(f) {
    const c = $('map');
    if (!c || !f.plan) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = c.clientWidth, h = Math.round(w * 0.75);
    /**
     * ⚠️ ASSIGNING `width` REALLOCATES THE BACKING STORE AND WIPES IT, EVEN WHEN THE VALUE IS THE
     * ONE ALREADY THERE. This ran unconditionally on a function called once per frame, so a guide
     * at 5 Hz threw away and re-allocated a 423×317 device-pixel buffer 450 times an expedition
     * for no reason at all. It is set only when the element has actually changed size — and
     * because a resize is what resets the transform, the transform is now set explicitly rather
     * than multiplied on by `scale()`.
     */
    const W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const xs = f.plan.flatMap((r) => [r.x0, r.x1]), zs = f.plan.flatMap((r) => [r.z0, r.z1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    const pad = 10, k = Math.min((w - pad * 2) / (x1 - x0), (h - pad * 2) / (z1 - z0));
    const px = (x) => pad + (x - x0) * k, pz = (z) => pad + (z - z0) * k;
    g.clearRect(0, 0, w, h);
    for (const r of f.plan) {
      g.fillStyle = '#161b25'; g.strokeStyle = '#2a3244'; g.lineWidth = 1;
      g.fillRect(px(r.x0), pz(r.z0), (r.x1 - r.x0) * k, (r.z1 - r.z0) * k);
      g.strokeRect(px(r.x0), pz(r.z0), (r.x1 - r.x0) * k, (r.z1 - r.z0) * k);
    }
    for (const m of f.marks || []) drawMark(g, m, px(m.x), pz(m.z));
  }

  /**
   * 🚨 **THIS WAS A RED DOT AND A GREEN DOT, DISTINGUISHED OTHERWISE ONLY BY 7px AGAINST 5px.**
   *
   * Under deuteranopia `#e4483a` and `#4cc27a` render as `#959529` and `#a7a77e` — two olive dots
   * on a dark plan, at a glance, on a 390px screen, under a 90-second clock. This is the **only
   * private information in the entire game**, on the phone of the one player whose whole job is to
   * read it and say what it means out loud, and eight percent of the men at any party cannot.
   *
   * `rrr-broadcast.md` §4 is the rule — *"every state change carries a non-colour channel"* — and
   * `rrr-phone-ux.md` §4 is the shape: *"Marks are shapes first. Runner = filled triangle pointing
   * along heading. Hunter = hollow ring, its stroke thickening with `awareness`. Objective =
   * square. Each has a one-word label. Colour is redundant."* Three channels ship here:
   *
   *   · **fill against hole.** The Hunter is a ring with the floor showing through it; you are a
   *     solid disc. That difference survives any colour transform, including a monochrome screen.
   *   · **a light rim on both**, so each mark separates from the plan by luminance and not by hue.
   *   · **a word.** `HUNTER` and `YOU`, in caps, knocked out of a dark halo so they read over a
   *     room fill. The television does the equivalent by putting the seat number inside the dot.
   *
   * ⚠️ AND THE RUNNER IS A DISC RATHER THAN §4'S TRIANGLE, DELIBERATELY. A triangle *points*, and
   * `session.js`'s marks carry `{x, z, kind}` and no heading — so a triangle here would be
   * pointing somewhere nobody sent, which on a guide's map is worse than a circle. The shape is
   * available the moment a heading is on the mark; that belongs to the frame, not to this file.
   */
  function drawMark(g, m, x, y) {
    const hunter = m.kind === 'hunter';
    if (hunter) {
      g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2);
      g.strokeStyle = '#e4483a'; g.lineWidth = 4.5; g.stroke();
      g.beginPath(); g.arc(x, y, 11.5, 0, Math.PI * 2);
      g.strokeStyle = '#f2f4f8'; g.lineWidth = 1.5; g.stroke();
    } else {
      g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2);
      g.fillStyle = '#4cc27a'; g.fill();
      g.strokeStyle = '#f2f4f8'; g.lineWidth = 1.5; g.stroke();
    }
    mapLabel(g, hunter ? 'HUNTER' : 'YOU', x, y + (hunter ? 23 : 19));
  }

  /** A word, knocked out of its own halo so it survives whatever room fill is under it. */
  function mapLabel(g, txt, x, y) {
    g.font = '700 12px ui-sans-serif,system-ui,-apple-system,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = '#0d1017';
    g.strokeText(txt, x, y);
    g.fillStyle = '#f2f4f8'; g.fillText(txt, x, y);
  }

  // ---------------------------------------------------------------- the runner's stick
  let heading = 0, detent = 0, driveTimer = null, driveTail = null, driveAt = 0;
  const DETENTS = ['STILL', 'CREEP', 'WALK', 'RUN'];
  function driveCard() {
    return '<div class="card"><h3>Drive</h3>'
      + '<canvas id="stick" style="width:100%;aspect-ratio:1/1;background:#0d1017;border-radius:16px;touch-action:none"></canvas>'
      + '<div class="note">Drag to steer. The ring is how far your noise carries.</div></div>'
      + '<div class="card" style="margin-top:10px"><h3>Throttle</h3>'
      + DETENTS.map((d, i) => '<button data-det="' + i + '">' + d + '</button>').join('')
      + '</div>';
  }
  function wireDrive() {
    for (const b of $('controls').querySelectorAll('[data-det]')) {
      b.onclick = () => { detent = +b.dataset.det; controls(); pushDrive(); };
    }
    const c = $('stick');
    if (!c) return;
    const set = (e) => {
      const r = c.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      // Screen up is -Y and world north is +Z, so the stick's Y is negated exactly once, here.
      heading = Math.atan2(t.clientX - (r.left + r.width / 2), -(t.clientY - (r.top + r.height / 2)));
      paintStick(); pushDrive();
    };
    c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); set(e); });
    c.addEventListener('pointermove', (e) => { if (c.hasPointerCapture(e.pointerId)) set(e); });
    paintStick();
    stopDrive();
    driveTimer = setInterval(pushDrive, 250);       // a held heading still has to arrive
  }

  /** The detents are a class on four buttons, so they are an update and never a rebuild. */
  function paintDetents() {
    for (const b of $('controls').querySelectorAll('[data-det]')) b.classList.toggle('on', +b.dataset.det === detent);
    paintStick();
  }

  /**
   * 🚨 **THE STICK'S TIMER OUTLIVED THE EXPEDITION BY THE REST OF THE SHOW.** `driveTimer` was
   * never cleared: the only `clearInterval` was at the top of `wireDrive`, and `wireDrive` is not
   * called again once EXPEDITION ends. So the moment a player had been the runner once, their
   * phone sent `{t:'drive'}` at 4 Hz for the remaining ~25 minutes of the evening — measured, in
   * a browser: **4.0 messages a second, still going, after the phase had moved on to RECAP.** The
   * server drops every one of them on the phase check, silently, so nothing anywhere complained;
   * the only cost was the radio, which is to say the battery, on the phone of the person who has
   * just done the most work.
   *
   * The sheet that starts it is the sheet that stops it — `mount`'s `sheetDrop`.
   */
  function stopDrive() {
    clearInterval(driveTimer); driveTimer = null;
    clearTimeout(driveTail); driveTail = null;
  }
  function paintStick() {
    const c = $('stick'); if (!c) return;
    const dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = w;
    // ⚠️ SAME REALLOCATION AS THE MAP'S, AND ON A HOTTER PATH: `set()` repaints on every
    // `pointermove`, so this threw away the stick's backing store sixty times a second under a
    // moving thumb. Sized only when the element's size actually changes.
    const W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = w / 2, cy = h / 2, R = w * 0.42;
    g.clearRect(0, 0, w, h);
    // The noise ring: `audibleRange(noise) = 14 * noise` metres, drawn to the same scale as the
    // stick so a detent's cost is a size rather than a number.
    const noise = [0, 0.90 / 5.20, 2.55 / 5.20, 1][detent];
    g.beginPath(); g.arc(cx, cy, Math.max(4, R * noise), 0, Math.PI * 2);
    g.fillStyle = 'rgba(228,72,58,0.16)'; g.fill();
    g.strokeStyle = 'rgba(228,72,58,0.5)'; g.stroke();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.strokeStyle = '#2a3244'; g.stroke();
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.sin(heading) * R, cy - Math.cos(heading) * R);
    g.strokeStyle = '#e0b23c'; g.lineWidth = 4; g.stroke();
  }
  /**
   * 🚨 **THE DRIVE CHANNEL WAS 15-30x DENSER THAN EVERY COMMENT ABOUT IT BELIEVED.**
   *
   * `views/expedition.js`'s header reasons from *"the phone sends an absolute world compass
   * bearing at 4 Hz"*. It did not: `pointermove` called `set()` called `pushDrive()` **on every
   * single move event**, on top of the 250 ms keep-alive. Measured here, in a real browser at a
   * dispatch rate a headless box could sustain: **66 `drive` messages in 998 ms from one drag,
   * all 66 relayed to the simulator**, and a real 120 Hz touchscreen doubles that again. A critic
   * measured the relay itself has no gate whatsoever — 3000 sent, 3000 forwarded.
   *
   * `rrr-phone-ux.md` §5's **D-P2** is the number that ships: *"Continuous input is a LEVEL
   * snapshot at 20 Hz"*, matching `client.js`'s `sendHz`. Leading edge plus a trailing send, so a
   * flick that ends between ticks still delivers the heading it ended on — a throttle that drops
   * the last sample is a stick that does not go where you put it.
   *
   * ⚠️ AND THE 250 ms KEEP-ALIVE STAYS, because a held heading with no movement still has to
   * arrive. It now coalesces through the same gate rather than racing it.
   *
   * ⚠️ WHAT IS NOT CHANGED HERE, AND IT IS REPORTED RATHER THAN FIXED: §3.1 specifies the stick's
   * horizontal axis as **yaw rate**, *"eased, capped at `MOVE.turnRate` (3.4 rad/s)"*, and this
   * page sends an absolute world compass bearing instead. That is a control-scheme decision with a
   * receiving end in somebody else's file; changing it from here would be changing the game from
   * the controller.
   */
  const DRIVE_MS = 50;
  function pushDrive() {
    if (!ws || ws.readyState !== 1) return;
    const now = Date.now(), wait = DRIVE_MS - (now - driveAt);
    if (wait > 0) {
      if (!driveTail) driveTail = setTimeout(() => { driveTail = null; pushDrive(); }, wait);
      return;
    }
    driveAt = now;
    ws.send(JSON.stringify({ t: 'drive', heading, detent }));
  }

  /**
   * 🚨 REFUSE THE CHAIR — round §2. *"Once per game, a player voted into a chair may REFUSE THE
   * CHAIR. Public, attributed, permanent, and logged. The runner-up in that slot takes it."*
   *
   * `ballot.js`'s `refuse()` has been implemented and gated since it was written and was
   * unreachable, because `refuse` was absent from `session.js`'s INPUT list — so this button is
   * the last quarter of a feature that was three-quarters built. It is offered only while the
   * chair is still unused: once you have called it or moved, the chair has been spent.
   */
  function refuseCard() {
    const mine = ((frame && frame.players) || []).find((x) => x.id === iAm());
    if (!mine || mine.refused) return '';
    if (frame.you && frame.you.acted) return '';
    return '<button class="kill" id="refuse" style="margin-top:10px">Refuse the chair</button>'
      + '<div class="note">Once a game, and the runner-up takes it. Everyone is told it was you.</div>';
  }
  function wireRefuse() {
    if ($('refuse')) $('refuse').onclick = () => act({ t: 'refuse' });
  }

  /**
   * 🚨 **THE CLAIM PRESETS, AND THE FREE-TEXT BOX THEY REPLACE.** `rrr-phone-ux.md` §2.5's own
   * *cheap v1* is *"presets only, publish on tap, no drafts"*, and that is what this is — the
   * server has never carried a draft (`players[].claim` is PUBLISHED claims and nothing else), so
   * the text field was cheap v1 with the cheap part taken out and a keyboard put in.
   *
   * ⚠️ THESE ARE THE SEVEN GOOD CARDS BY THEIR SHIPPED DISPLAY NAMES — `roles.js`'s `SCRIPT`, in
   * the same words `rrr-roles.md` §2 uses. `show-wire` X15 compares this list against `SCRIPT` so
   * the two cannot drift; a claim the room cannot check against the script is not a claim.
   * Production is not offered, because a preset that nobody would ever tap is a wasted row.
   */
  const CLAIMS = ['Contestant', 'Camera Op', 'Focus Puller', 'Continuity', 'The Editor', 'Fan Favourite', 'Stunt Double'];

  /**
   * The claim plate and the nameplate rail — round §1's phase table, `Phones` column, which reads
   * **claims/nameplates only** for DEBRIEF.
   *
   * 🚨 NO KEYBOARD. What shipped here was a text input and a Publish button, and the comment
   * above `DARK` condemns exactly that: it hands a guide idle seconds holding a PRODUCIBLE alibi,
   * composed rather than said. A6 took it off the three phases the table calls dark — worth 20 s,
   * 20 s and 15 s — and left it on the seventy-five-second one, which is the phase it does the
   * most damage to, because DEBRIEF is the argument. A tap is a claim; a typed sentence is an
   * exhibit.
   */
  /**
   * ⚠️ THE RAIL IS THE PART THAT MOVES. Seven other people publish claims during a 75-second
   * DEBRIEF and each publication is a frame, so this sheet was rebuilt seven times underneath a
   * table of seven tappable presets. The plates are written in place now; the sheet is rebuilt
   * only when the room's shape changes — somebody dies, or your own claim goes up.
   */
  function claimSheet() {
    const mine = ((frame && frame.players) || []).find((p) => p.id === iAm());
    const others = living().filter((p) => p.id !== iAm());
    return mount('claim|' + (mine && mine.claim ? 'published' : 'open') + '|' + others.map((p) => p.id).join(','),
      () => (mine && mine.claim
        ? '<div class="card"><h3>Your claim</h3><div class="say">You are telling the room you are '
          + '<b>' + esc(mine.claim) + '</b>. A published claim stands — there is no taking it back.</div></div>'
        : '<div class="card"><h3>Claim a role, or don\'t</h3>'
          + CLAIMS.map((c) => '<button data-claim="' + esc(c) + '">' + esc(c) + '</button>').join('')
          + '<div class="note">One tap publishes it to your nameplate on the television, for the rest '
          + 'of the game. Blank is a statement too, and it is the default.</div></div>')
        + '<div class="card" style="margin-top:10px"><h3>The table</h3>'
        + others.map((p) => '<div class="plate" data-plate="' + esc(p.id) + '">' + swatch(p.id)
          + '<b class="nm"></b><span class="say tail"></span></div>').join('')
        + '<div class="note">A nameplate is what somebody is willing to have checked. '
        + 'Everything else is said out loud.</div></div>',
      () => {
        for (const b of $('controls').querySelectorAll('[data-claim]')) {
          b.onclick = () => act({ t: 'claim', claim: b.dataset.claim });
        }
        return () => {
          for (const d of $('controls').querySelectorAll('[data-plate]')) {
            const id = d.dataset.plate, p = ((frame && frame.players) || []).find((x) => x.id === id);
            const sw = d.querySelector('.sw');
            if (sw) { sw.style.background = colourOf(id); sw.textContent = p ? p.seat + 1 : ''; }
            d.querySelector('.nm').textContent = p ? p.name : id;
            d.querySelector('.tail').textContent = p && p.claim ? '“' + p.claim + '”' : 'undeclared';
          }
        };
      });
  }

  /**
   * PREMIERE. This used to fall through to the claim plate, so the first thing a first-time player
   * ever saw was a free-text box and an irreversible public Publish button sitting ABOVE the
   * button that shows them their own card. `rrr-phone-ux.md` §1 has the role card arriving *"on
   * deal"*; there is nothing else the phone should be during the premiere.
   */
  function premiereCard() {
    return '<div class="card"><h3>Your card</h3>'
      + '<div class="say">It is on this phone and on no screen in the room. Hold the button below '
      + 'to read it — it stays blurred until a finger is on it, so nobody beside you can read it '
      + 'over your shoulder and nobody has to remember to put it away.</div>'
      + '<div class="note">Then put the phone down. Everything after this happens out loud.</div></div>';
  }

  const colourOf = (id) => {
    const p = ((frame && frame.players) || []).find((x) => x.id === id);
    if (!p) return '#8b93a3';
    const r = roster.find((x) => x.seat === p.seat);
    // The seat's own colour is authoritative before the first roster lands, and identical after.
    return (r && r.colour) || (seat && p.seat === seat.seat ? seat.colour : '#8b93a3');
  };
  /**
   * 🚨 THE SWATCH SAYS WHICH SEAT, NOT JUST WHICH HUE. It was a bare empty coloured circle. Today
   * it sits beside a name, so it is redundant rather than sole-channel — but the eight-seat
   * palette has measured deuteranope confusions at ΔE2000 **3.3** (seat 2 blue against seat 5
   * purple) and **4.6** (seat 6 pink against seat 7 teal), which is not "similar", it is the same
   * colour; and the lobby accepts three guests all called Sam, at which point the dot IS the
   * discriminator. `show-tv.html:260` already draws `p.seat + 1` inside its own dot — this is the
   * same number, so the phone and the television name people identically.
   */
  const seatNo = (id) => { const p = ((frame && frame.players) || []).find((x) => x.id === id); return p ? p.seat + 1 : ''; };
  const swatch = (id) => '<span class="sw" style="background:' + colourOf(id) + '">' + seatNo(id) + '</span>';
  /**
   * 🚨 THE PHONE NAMED THE ROOM `study_w` TOO. Same fix as the television's, same reason, same
   * copy: `src/party/captions.js`'s ROOM_LABEL, held against the original by `show-wire` X17.
   */
  const ROOM_LABEL = {
    ballroom: 'THE BALLROOM', gallery: 'THE LONG GALLERY', study_w: 'THE WEST STUDY',
    study_e: 'THE EAST STUDY', service: 'THE SERVICE PASSAGE', chapel: 'THE CHAPEL',
  };
  const wing = () => ROOM_LABEL[((frame && frame.expedition) || {}).room] || 'the house';

  /**
   * The casting ballot's one list. A name already taken shows the chair it holds and stays live so
   * it can be taken back; every other name goes flat once both chairs are full, because a third
   * tap that silently reassigned a chair is the mis-tap §2.6 calls the most expensive input error
   * in the game.
   */
  function castButtons() {
    return living().map((p) => row('c|' + p.id, p)).join('');
  }

  function peopleButtons(slot, excludeSelf) {
    return living().filter((p) => !(excludeSelf && p.id === iAm())).map((p) => row(slot + '|' + p.id, p)).join('');
  }

  /**
   * One name, one button, and every part of it that MOVES is a node with a name on it. The swatch
   * and the trailing badge are written by `paintPerson` on later frames rather than re-emitted,
   * which is the whole difference between a list you can tap and a list that eats taps.
   */
  const row = (pick, p) => '<button data-pick="' + esc(pick) + '">' + swatch(p.id)
    + '<span class="nm">' + esc(p.name) + '</span>'
    + '<span class="say tail" style="margin-left:auto"></span></button>';

  function paintPerson(b, id, badge, warn) {
    const p = ((frame && frame.players) || []).find((x) => x.id === id);
    const sw = b.querySelector('.sw');
    // The roster can land after the first frame, so the colour and the number are refreshed here
    // rather than baked into the html — otherwise the whole sheet would be grey until it rebuilt.
    if (sw) { sw.style.background = colourOf(id); sw.textContent = p ? p.seat + 1 : ''; }
    const nm = b.querySelector('.nm');
    if (nm && p) nm.textContent = p.name;
    const tail = b.querySelector('.tail');
    if (!tail) return;
    tail.className = 'say tail' + (warn ? ' warn' : '');
    tail.textContent = badge || (p && p.claim ? '“' + p.claim + '”' : '');
  }

  function render() {
    if (!frame) return;
    $('joinCard').classList.add('hide');
    $('play').classList.remove('hide');
    $('ph').textContent = frame.phase;
    const s = SAY[frame.phase];
    $('say').textContent = typeof s === 'function' ? s() : (s || '');
    if (frame.phase !== lastPhase) {
      // The card closes itself on every phase change — nobody has to remember to put it away.
      $('cardView').classList.remove('lit');
      $('cardView').classList.add('hide');
      pickRunner = pickGuide = myVote = null;
      lastPhase = frame.phase;
      $('refused').textContent = '';
    }
    controls();
  }

  function paintClock() {
    if (!frame || !frame.clock) return;
    $('clock').textContent = Math.max(0, Math.ceil((frame.clock.endsAt - Date.now()) / 1000)) + 's';
  }

  // ---------------------------------------------------------------- the wire
  /**
   * 🚨 **A SOCKET THAT REPORTS OPEN AND IS DEAD WAS NEVER DETECTED, AND THE SERVER HAS BEEN
   * SENDING THE EVIDENCE FOUR TIMES A SECOND THE WHOLE TIME.**
   *
   * Reconnection was `if (document.visibilityState === 'visible' && ws.readyState > 1)`, so it
   * depended entirely on a `close` event arriving. A NAT table expiring on a home router, or a
   * wifi-to-cellular flap, produces a TCP connection that is gone at both ends of the middle and
   * OPEN at this one: no `close`, no `error`, nothing. Measured, against a real server with the
   * downstream muted: **six seconds of total silence, zero reconnect attempts, and the top strip
   * still reading `connected`.** The phone holds a frozen frame, `paintClock` counts past zero,
   * and every tap goes into `ws.send()` on a dead socket and returns without throwing.
   *
   * `show.mjs:335` pings every live seat every `TICK_MS` — 250 ms — so a seated phone is told the
   * wire is alive four times a second and this page threw all of it away. Recording the arrival is
   * one line. The thresholds are `rrr-phone-ux.md` §5's degradation ladder, in its own numbers:
   *
   *   · **1.5 s** — six missed pings. The strip goes down and `act()` starts holding taps, which
   *     is the ladder's *"600 ms silence: edge glow solid, RECONNECTING in the strip"* moved out
   *     to a threshold a congested 2.4 GHz AP with eight phones on it cannot trip by jitter.
   *   · **3 s** — the ladder's own *"3 s silence"* row. The socket is declared dead and the
   *     reconnect path runs, which is the path that already exists and already works: measured at
   *     socket open 2 ms, seated 4 ms, first frame 7 ms.
   *
   * ⚠️ THE WATCHDOG ONLY ARMS ONCE THERE IS A SEAT, because the server pings SEATS. A phone
   * sitting on the join card is sent nothing at all, and a watchdog that did not know that would
   * tear down a perfectly good socket every three seconds for as long as somebody took to type
   * their name.
   */
  const STALE_MS = 1500, DEAD_MS = 3000;
  let lastPing = 0;
  const silence = () => (seat && lastPing ? Date.now() - lastPing : 0);
  const wireLive = () => !!ws && ws.readyState === 1 && silence() < STALE_MS;

  function checkWire() {
    if (ws && ws.readyState === 1 && silence() >= DEAD_MS) {
      // ⚠️ THE HANDLERS COME OFF FIRST. A half-open socket may take its own time to fire `close`,
      // and a late `close` from a socket we have already replaced would schedule a second connect
      // on top of the live one.
      const dead = ws;
      ws = null;
      dead.onopen = dead.onmessage = dead.onclose = dead.onerror = null;
      try { dead.close(); } catch (_) {}
      setState('reconnecting…', true);
      backoff = 500;
      connect();
    } else if (ws && ws.readyState === 1 && silence() >= STALE_MS) {
      setState('reconnecting…', true);
    }
    // ⚠️ AND THE FLUSH LIVES HERE AS WELL AS ON `seated`. A wire that went stale and came back
    // without ever closing never re-seats, so a tap held across that gap would have waited for a
    // `seated` that was not coming.
    if (wireLive()) flushHeld();
    offair();
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/');
    ws.onopen = () => {
      backoff = 500;
      lastPing = seat ? Date.now() : 0;
      setState(seat ? 'connected' : 'ready');
      if (wantJoin || localStorage.getItem(KEY)) join();
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'seated') {
        seat = m; localStorage.setItem(KEY, m.token);
        lastPing = Date.now();
        $('sw').style.background = m.colour; $('sw').textContent = m.seat + 1;
        $('me').textContent = m.name;
        $('joinCard').classList.add('hide'); setState('connected');
        // The seat is back, so anything the player tapped while it was gone can go now.
        flushHeld();
      }
      if (m.t === 'full') { $('go').disabled = true; $('go').textContent = 'Room is full'; }
      /**
       * 🚨 A CLOSED DOOR WITH A REASON ON IT. The server used to seat a phone that arrived after
       * the bell, and a seated phone with no card is worse than a refused one: the deal was made
       * for the people who were in the room, so this phone would never be sent a single frame and
       * every tap would come back "not in this show". Nothing on the screen would say why.
       * A phone that locked and came back is not this — it reclaims by token and never gets here.
       */
      if (m.t === 'late') {
        $('go').disabled = true;
        $('go').textContent = 'Already rolling';
        $('joinNote').textContent = esc(m.why || 'the show has already started')
          + ' — you can watch on the television. The next one starts from the lobby.';
      }
      if (m.t === 'roster') {
        roster = m.players || [];
        if (seat) {
          const mine = roster.find((x) => x.seat === seat.seat);
          if (mine) { $('me').textContent = mine.name; $('rt').textContent = mine.rtt == null ? '' : mine.rtt + 'ms'; }
        }
        if (frame) render();
      }
      if (m.t === 'state') { frame = m.frame; render(); }
      if (m.t === 'refused') { $('refused').innerHTML = '<span class="warn">' + esc(m.why) + '</span>'; }
      /**
       * 🚨 THE PHONE SAID "SEASON FINALE. Look at the television." AND NOTHING ELSE, WHILE HOLDING
       * THE WHOLE SPECIAL. The television carries the beats for the room (`show-tv.html`); this
       * carries the one row that is about the person holding it — the answer to a card they were
       * handed in the premiere and never allowed to check. The Glitched learns here, and only
       * here, that the role on their card was never theirs.
       */
      if (m.t === 'reunion') {
        const me = ((m.special && m.special.rollCall) || []).find((p) => p.id === iAm());
        const rest = ((m.special && m.special.rollCall) || []).filter((p) => p.id !== iAm());
        const line = (p, first) => '<div class="say"' + (first ? ' style="font-weight:700"' : '') + '>'
          + esc(first ? 'You were ' : nameOf(p.id) + ' — ') + '<b>' + esc(p.role) + '</b>'
          + ' <span class="warn">' + esc(p.alignment) + '</span>'
          + (p.believedTheyWere && p.believedTheyWere !== p.role
            ? '<br><span class="note">' + esc(first ? 'and you were told you were the '
              : 'was told they were the ') + esc(p.believedTheyWere) + '</span>' : '')
          + '</div>';
        // The Reunion writes this box itself, so the sheet mounted under it is forgotten — a
        // later frame must rebuild rather than "update" the roll call into the wrong shape.
        dropSheet();
        $('controls').innerHTML = '<div class="card"><h3>' + esc(m.outcome) + '</h3>'
          + (me ? line(me, true) : '')
          + '<div class="note" style="margin-top:10px">Everyone else — the television has the rest.</div>'
          + rest.map((p) => line(p, false)).join('')
          + '</div>';
      }
      // The pong echoes the SERVER's clock value. Phone clocks at a party disagree by minutes.
      // 🚨 AND THE ARRIVAL IS THE DATUM. One line — the whole of `checkWire` rests on it.
      if (m.t === 'ping') {
        lastPing = Date.now();
        if (seat) setState('connected');
        ws.send(JSON.stringify({ t: 'pong', at: m.at }));
        offair();
      }
    };
    ws.onclose = () => { setState('reconnecting…', true); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 5000); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  const setState = (txt, down) => { $('state').textContent = txt; $('bar').className = 'bar' + (down ? ' down' : ''); };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (ws && ws.readyState > 1) { backoff = 500; connect(); return; }
    // A tab that has been asleep is the exact case a `close` never arrives for — so ask.
    checkWire();
  });
  setInterval(() => { paintClock(); checkWire(); }, 250);
  connect();
})();
</script>
