<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Prime Time</title>
<!--
  📱 THE CONTROLLER. Under D13 the runner's view is on the television, so the phone is never a
  window into the game — it is the private half: your card, and the four taps only you can make.

  🚨 THE CARD IS HOLD-TO-REVEAL, WHICH IS `rrr-phone-ux.md` §2.3 VERBATIM: *"the card is blurred
  until a finger is held on it, so a neighbour's glance at an unattended phone reveals nothing.
  Releasing re-blurs after 400 ms."* This shipped as the doc's own *cheap v1* — tap to open, tap to
  close — and the comment here defended that as the design, which it never was. A tap-to-open card
  is readable by the person beside you for exactly as long as its owner is distracted, and eight
  people on a sofa is a room built out of distraction. A held finger is a card nobody else can read
  and nobody can forget to put away.

  🚨 THIS PAGE IS NOT TOLD WHAT IT IS NOT ENTITLED TO. There is no filtering here and there must
  never be — `project()` on the server decides, and the fields simply are not in the frame. If a
  future version hides something in CSS, that secret is one "inspect element" from the table.

  ⚠️ NO WAKE LOCK, SAME AS THE SPIKE. A phone that locks and comes back to its own seat is the
  thing being tested; suppressing the lock would answer the question by preventing it.
-->
<style>
  :root{ --ink:#f2f4f8; --dim:#8b93a3; --bg:#0b0d12; --panel:#161b25; --edge:#262d3d;
         --live:#4cc27a; --gone:#e4483a; --warn:#e0b23c; --evil:#e4483a; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:400 17px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
       display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 14px
       calc(14px + env(safe-area-inset-bottom));overscroll-behavior:none}
  .bar{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.1em;color:var(--dim);
       text-transform:uppercase;font-variant-numeric:tabular-nums}
  .bar .sw{width:14px;height:14px;border-radius:50%;flex:none}
  .bar .me{color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0;font-size:15px}
  .bar .rt{margin-left:auto}
  .bar.down{color:var(--gone)}

  .phase{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .phase h2{font:700 22px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .phase .t{font:700 22px/1 ui-monospace,Menlo,monospace;color:var(--warn);font-variant-numeric:tabular-nums}

  .card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px}
  .card h3{font:600 12px/1 ui-sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
  .say{color:var(--dim);font-size:15px;line-height:1.5}

  /* 🚨 60px MINIMUM. A thumb-miss during a nomination is a vote for the wrong person. */
  button{width:100%;min-height:60px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);
         border:1px solid var(--edge);font:600 18px/1.2 inherit;padding:12px;display:flex;align-items:center;gap:10px;
         justify-content:flex-start;text-align:left;margin-top:8px}
  button.big{justify-content:center;font:700 22px/1 inherit;letter-spacing:.08em;min-height:76px}
  button.go{background:var(--live);color:#06170d;border-color:transparent}
  button.stop{background:var(--warn);color:#171203;border-color:transparent}
  button.kill{background:var(--gone);color:#1a0605;border-color:transparent}
  button.on{outline:3px solid var(--warn);outline-offset:-3px}
  button:disabled{opacity:.35}
  button .sw{width:18px;height:18px;border-radius:50%;flex:none}
  input{width:100%;background:#0d1017;border:1px solid var(--edge);border-radius:12px;color:var(--ink);
        font:600 20px/1.2 inherit;padding:14px;outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .two button{margin-top:0}
  .hide{display:none!important}
  .note{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.45}
  /* 🚨 THE DARK CARD — round §1's phase table, the `Phones` column, where three rows read "dark". */
  .down{font:700 26px/1.15 ui-sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center;
        color:var(--dim);padding:26px 8px 8px}
  .down + .say{text-align:center;padding-bottom:22px}
  .warn{color:var(--warn)} .bad{color:var(--gone)} .good{color:var(--live)}
  /* the nameplate rail — round §1's phase table gives DEBRIEF "claims/nameplates only" */
  .plate{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--edge)}
  .plate:last-of-type{border-bottom:0}
  .plate .sw{width:14px;height:14px;border-radius:50%;flex:none;align-self:center}
  .plate .say{margin-left:auto;font-style:italic;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* the card */
  .role{font:700 30px/1.1 ui-sans-serif;margin-bottom:6px}
  .align{font:600 12px/1 ui-sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .mates{margin-top:14px;border-top:1px solid var(--edge);padding-top:12px}
  .mates .m{display:flex;gap:8px;align-items:baseline;font-size:16px;margin-top:6px}
  .mates .m b{color:var(--evil)}
  .flag{position:fixed;inset:0;background:var(--bg);z-index:9;padding:28px 20px;display:flex;
        flex-direction:column;justify-content:center;gap:18px;touch-action:none}
  /* §2.3. The blur is the resting state and `lit` is the exception, so a script that never runs
     leaves the card unreadable rather than open — the safe direction to fail in. */
  #cardFace{filter:blur(16px);transition:filter .16s ease;user-select:none;-webkit-user-select:none}
  .flag.lit #cardFace{filter:none}
  .holdnote{font:600 13px/1.4 ui-sans-serif;letter-spacing:.18em;text-transform:uppercase;
            color:var(--dim);text-align:center}
  .flag.lit .holdnote{color:var(--live)}
</style>

<div class="bar" id="bar">
  <span class="sw" id="sw"></span><span class="me" id="me">…</span>
  <span id="state">connecting…</span><span class="rt" id="rt"></span>
</div>

<!-- lobby -->
<div class="card" id="joinCard">
  <h3>Your robot's name</h3>
  <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="ROBOT">
  <button class="big stop" id="go">Take a seat</button>
  <div class="note" id="joinNote">Same wifi, nothing installs. The show starts on the TV.</div>
</div>

<!-- playing -->
<div id="play" class="hide">
  <div class="phase"><h2 id="ph">—</h2><span class="t" id="clock"></span></div>
  <div class="card" style="margin-top:12px"><div class="say" id="say">…</div></div>
  <div id="controls"></div>
  <!-- §2.3's persistent ROLE tab: it reopens the card in any phase, and it is never a reveal. -->
  <button id="cardBtn" style="margin-top:14px">🎴 <span>Your card — hold to read</span></button>
  <div class="note" id="refused"></div>
</div>

<!-- the card, full screen, blurred until a finger is held on it — §2.3 -->
<div class="flag hide" id="cardView">
  <div id="cardFace">
    <div class="align" id="cardAlign">You are</div>
    <div class="role" id="cardRole">—</div>
    <div class="say" id="cardSay"></div>
    <div class="mates hide" id="cardMates"></div>
  </div>
  <div class="holdnote" id="holdNote">Hold anywhere to read</div>
  <button class="big" id="cardClose">Close</button>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const CODE = (location.search.match(/[?&]c=([a-z0-9]+)/i) || [, 'show'])[1];
  const KEY = 'rrr.show.token.' + CODE, NKEY = 'rrr.show.name.' + CODE;

  let ws = null, seat = null, frame = null, me = null, backoff = 500, wantJoin = false, reported = false;
  /**
   * 🚨 THE WHOLE ROSTER, NOT JUST MY OWN SEAT. The `roster` message has always carried a colour
   * for every player and this page kept only its own, so every swatch on every sheet except the
   * bar at the top drew `#8b93a3` — and a grey dot beside a name is not neutral, it is a phone
   * and a television DISAGREEING about who is who in a game where the nameplate rail is how you
   * refer to people out loud. Same array the TV draws its circle from, same colours.
   */
  let roster = [];
  let pickRunner = null, pickGuide = null, lastPhase = null;

  $('name').value = localStorage.getItem(NKEY) || '';
  $('go').onclick = () => {
    wantJoin = true;
    localStorage.setItem(NKEY, $('name').value.trim());
    $('go').disabled = true; $('go').textContent = 'Taking a seat…';
    if (ws && ws.readyState === 1) join();
  };
  // ---------------------------------------------------------------- the card, held
  /**
   * 🚨 §2.3, AND THE 400 ms IS THE SPEC'S NUMBER RATHER THAN A FEEL ONE. *"Releasing re-blurs
   * after 400 ms."* The delay exists so a finger that slips off the glass mid-read does not snap
   * the card shut, which would train people to press harder and longer — the opposite of what
   * this is for.
   *
   * ⚠️ POINTER EVENTS, NOT `touchstart`, AND `setPointerCapture` IS WHAT MAKES RELEASE RELIABLE.
   * Without capture a finger that drifts off the element never delivers `pointerup` to it, and
   * the card stays lit on a phone lying face-up on a sofa arm — precisely the failure the blur
   * exists to prevent.
   */
  let reblur = null;
  const lit = (on) => {
    clearTimeout(reblur);
    if (on) return $('cardView').classList.add('lit');
    reblur = setTimeout(() => $('cardView').classList.remove('lit'), 400);
  };
  $('cardBtn').onclick = () => { showCard(); lit(false); $('cardView').classList.remove('hide'); };
  $('cardClose').onclick = (e) => { e.stopPropagation(); lit(false); $('cardView').classList.add('hide'); };
  $('cardView').addEventListener('pointerdown', (e) => {
    if (e.target.id === 'cardClose') return;
    e.preventDefault();
    try { $('cardView').setPointerCapture(e.pointerId); } catch (_) {}
    lit(true);
  });
  for (const ev of ['pointerup', 'pointercancel']) $('cardView').addEventListener(ev, () => lit(false));

  const act = (msg) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: 'act', msg }));

  function join() {
    ws.send(JSON.stringify({
      t: 'join', name: ($('name').value.trim() || '').slice(0, 14),
      token: localStorage.getItem(KEY) || null,
      boot: reported ? null : Math.round(performance.now()),
      ua: navigator.userAgent,
    }));
    reported = true;
  }

  // ---------------------------------------------------------------- the card
  /**
   * 🚨 ALIGNMENT COMES FROM `you.alignment`, WHICH WAS SITTING IN THE FRAME UNREAD WHILE THIS
   * INFERRED IT FROM `Array.isArray(you.teammates)`. At 6-8 players there are two in Production so
   * the array is non-empty and the guess held. At 4-5 there is exactly ONE — the array is empty,
   * `project()`'s prune legitimately deletes an empty array from the frame, and the sole traitor's
   * own phone told them they were GOOD. Not a display bug: a player who reads that card plays the
   * whole evening for the other side.
   *
   * ⚠️ AND THE WORD IS SPELLED OUT, NEVER COLOUR ALONE — §2.3, and §6's accessibility rule. Red
   * text on a black card in a dark lounge is not a message, it is a hint.
   */
  function showCard() {
    const you = (frame && frame.you) || {};
    const evil = you.alignment === 'evil';
    $('cardRole').textContent = you.role || '—';
    $('cardAlign').textContent = evil ? 'You are PRODUCTION' : 'You are GOOD';
    $('cardSay').innerHTML = evil
      ? '<span class="bad">You are Production.</span> Your job is to lose the show without ever being the reason.'
      : 'Light the cameras. Nobody will tell you if you are right.';
    const mates = $('cardMates');
    // The Production Panel is the one exception in the whole matrix, and it exists only here.
    if (evil && you.teammates.length) {
      mates.classList.remove('hide');
      mates.innerHTML = '<h3>Production</h3>' + you.teammates.map((m) =>
        '<div class="m"><b>' + esc(nameOf(m.id)) + '</b><span class="say">' + esc(m.role) + '</span></div>').join('');
    } else { mates.classList.add('hide'); mates.innerHTML = ''; }
  }

  const nameOf = (id) => { const p = ((frame && frame.players) || []).find((x) => x.id === id); return p ? p.name : id; };
  const living = () => ((frame && frame.players) || []).filter((p) => p.alive);
  const iAm = () => (frame && frame.you && frame.you.id) || null;
  const amRunner = () => frame && frame.pair && frame.pair.runner === iAm();
  const amGuide = () => frame && frame.pair && frame.pair.guide === iAm();
  const alive = () => { const p = ((frame && frame.players) || []).find((x) => x.id === iAm()); return !p || p.alive; };

  // ---------------------------------------------------------------- the controls
  const SAY = {
    PREMIERE: 'Read your card, then put the phone down. Everything after this happens out loud.',
    CASTING: () => 'Who goes into the ' + wing() + '? Two taps: your runner first, then your guide.',
    EXPEDITION: () => amGuide() ? 'You can see what the cameras can see. Tell them.'
      : amRunner() ? 'Your guide is looking. Then it is your call.'
      : 'Watch the television.',
    RECAP: 'Phones down. Watch the television.',
    DEBRIEF: 'Talk. Out loud, to the room. A nameplate is the only thing you can put in writing.',
    RECKONING: 'Nominate once, or keep it. Three stand at most.',
    VOTE: 'More than half the living, or nobody swings. Abstaining protects them.',
    EXECUTION: 'Nobody says what they were.',
    VERDICT: 'Phones down. Watch the television.',
    REUNION: 'It is over. Look up.',
  };

  function controls() {
    const box = $('controls');
    if (!alive()) {
      // C1: the dead get the chat and the Reunion. No ghost UI, by design.
      box.innerHTML = '<div class="card"><div class="say">You are out. You keep your voice and nothing else — '
        + 'no vote, no nominations. Stay in the room; the Reunion is coming.</div></div>';
      return;
    }
    const p = frame.phase;
    const acted = frame.you && frame.you.acted;

    /**
     * 🚨 SEQUENTIAL, ONE LIST — round §2, in its own words: *"Every living player makes exactly two
     * taps: first tap = their runner pick, second tap = their guide pick."* This shipped as two
     * separate labelled lists, which is a different ballot: it asks the table to hold two parallel
     * questions at once, and it puts the same eight names on screen twice on a 390px phone, so the
     * guide list is below the fold and half the room never scrolls to it.
     *
     * 🚨 THE SUBMIT IS ATOMIC AND THAT IS THE POINT OF THE BUTTON. Two taps that each sent a
     * message would let the bell catch a ballot with a runner and no guide — a half-vote nobody
     * cast, scoring one person and not the other. `CONFIRM PAIR` sends both picks in one message
     * or sends nothing, so the ballot the server tallies is always a ballot somebody finished.
     */
    if (p === 'CASTING') {
      const full = !!(pickRunner && pickGuide);
      box.innerHTML = '<div class="card"><h3>' + (pickRunner ? (full ? 'Your pair' : 'Now your guide') : 'First, your runner') + '</h3>'
        + castButtons(full) + '</div>'
        + '<button class="big stop" id="sendCast"' + (full ? '' : ' disabled') + '>'
        + (acted ? 'Change your pair' : 'Confirm pair') + '</button>'
        + '<div class="note">Two taps: the first is who runs, the second is who guides. '
        + 'Nothing is sent until you confirm — and nobody sees your ballot until the bell.</div>';
      for (const b of box.querySelectorAll('[data-pick]')) {
        b.onclick = () => {
          const id = b.dataset.pick.split('|')[1];
          if (pickRunner === id) pickRunner = null;
          else if (pickGuide === id) pickGuide = null;
          else if (!pickRunner) pickRunner = id;
          else if (!pickGuide) pickGuide = id;
          controls();
        };
      }
      // One message, both picks, or no message at all.
      $('sendCast').onclick = () => { if (pickRunner && pickGuide) act({ t: 'cast', runner: pickRunner, guide: pickGuide }); };
      return;
    }

    if (p === 'EXPEDITION') {
      if (amGuide()) {
        const f = frame.flyover || {};
        // 🚨 THE READING IS SHOWN EXACTLY AS IT ARRIVES, INCLUDING THE ABSENCE. "No signal" is not
        // an error state — it is a guide who genuinely does not know, and it is the only reason
        // a lie and an honest mistake look the same from the sofa.
        // The map, when the house is real. Marks and the floor plan arrive together and only for
        // a socket the matrix entitles — this page does no filtering and must never start.
        const map = (f.plan && f.plan.length)
          ? '<canvas id="map" style="width:100%;aspect-ratio:4/3;background:#0d1017;border-radius:12px;margin-bottom:10px"></canvas>'
          : '';
        const read = f.hunter
          ? '<div class="big bad" style="font:700 26px/1 ui-sans-serif">HUNTER — ' + esc(f.room || '?') + '</div>'
          : '<div class="big" style="font:700 26px/1 ui-sans-serif;color:var(--dim)">NO SIGNAL</div>';
        box.innerHTML = '<div class="card"><h3>Your cameras</h3>' + map + read
          + '<div class="note">' + (f.hunter ? 'A live camera has it.'
            : 'Nothing on the ' + wing() + '. That is not the same as empty.') + '</div></div>'
          + (frame.call && frame.call.said
            ? '<div class="card" style="margin-top:10px"><div class="say">You called <b>' + esc(frame.call.said) + '</b>.</div></div>'
            : '<div class="two" style="margin-top:10px">'
              + '<button class="big go" id="cl">CLEAR</button><button class="big stop" id="hd">HOLD</button></div>')
          + refuseCard();
        if ($('cl')) { $('cl').onclick = () => act({ t: 'call', call: 'CLEAR' }); $('hd').onclick = () => act({ t: 'call', call: 'HOLD' }); }
        wireRefuse();
        drawMap(f);
        return;
      }
      if (amRunner()) {
        // 🚨 THE RUNNER IS NOT SHOWN THE WORD, AND THAT IS BROADCAST §6.9 RATHER THAN AN OMISSION.
        // *"The guide talks out loud, in the room. That is the game."* The phone knows only that
        // the guide has spoken — `call.said` is not on this frame at all — so GO and WAIT unlock
        // on a fact about the clock, and what to do about it is something the runner has to have
        // heard, and can later be argued with about having heard.
        const said = frame.call && frame.call.made;
        // 🚨 A LIVE HOUSE MEANS A THROTTLE, NOT A BUTTON. With the mansion attached the runner's
        // decision is not "go or wait" once — it is a speed, continuously, against a Hunter that
        // hears them. `player.js:638` is `noise = speed / MOVE.run`, so the ring under the stick
        // IS the noise, and choosing RUN while it is close is loud, on camera, and completely
        // deniable as panic. That is the runner's whole dual-use verb under D13.
        if (frame.expedition && frame.expedition.live && said) { box.innerHTML = driveCard(); wireDrive(); return; }
        box.innerHTML = said
          ? '<div class="card"><h3>' + esc(nameOf(frame.pair && frame.pair.guide)) + ' has called it</h3>'
            + '<div class="say">Out loud, to the room. Nothing on this phone will repeat it.</div>'
            + '<div class="note">Waiting costs the camera. It does not cost you.</div></div>'
            + (acted ? '<div class="card" style="margin-top:10px"><div class="say">Locked in.</div></div>'
              : '<div class="two" style="margin-top:10px"><button class="big go" id="gogo">GO</button>'
                + '<button class="big" id="wait">WAIT</button></div>')
          : '<div class="card"><div class="say">Waiting for your guide.</div></div>';
        box.innerHTML += refuseCard();
        if ($('gogo')) { $('gogo').onclick = () => act({ t: 'move', move: 'GO' }); $('wait').onclick = () => act({ t: 'move', move: 'WAIT' }); }
        wireRefuse();
        return;
      }
      box.innerHTML = claimCard();
      wireClaim();
      return;
    }

    if (p === 'RECKONING') {
      box.innerHTML = acted
        ? '<div class="card"><div class="say">Your nomination stands. One each.</div></div>'
        : '<div class="card"><h3>Nominate</h3>' + peopleButtons('n', null, true) + '</div>';
      for (const b of box.querySelectorAll('[data-pick]')) {
        b.onclick = () => act({ t: 'nominate', target: b.dataset.pick.split('|')[1] });
      }
      return;
    }

    if (p === 'VOTE') {
      const noms = frame.nominations || [];
      if (!noms.length) { box.innerHTML = '<div class="card"><div class="say">Nobody was nominated. Nothing to vote on.</div></div>'; return; }
      box.innerHTML = '<div class="card"><h3>Execute</h3>'
        + noms.map((n) => '<button data-vote="' + n.target + '">'
          + swatch(n.target) + esc(nameOf(n.target))
          + '<span class="say" style="margin-left:auto">by ' + esc(nameOf(n.nominator)) + '</span></button>').join('')
        + '<button data-vote="NO_ONE">Abstain — protect them all</button>'
        + '<div class="note">You can change it until the clock runs out. Nothing is shown until then.</div></div>';
      for (const b of box.querySelectorAll('[data-vote]')) b.onclick = () => act({ t: 'vote', choice: b.dataset.vote });
      return;
    }

    /**
     * 🚨 THREE PHASES ARE DARK AND THE PHONE HAD CONTROLS ON ALL THREE. Round §1's phase table has
     * a `Phones` column and it reads **dark** for RECAP, EXECUTION and VERDICT; bible **P2** says
     * why in one line: *"After an Expedition, crew phones go dark: no logs, no replay, no notes.
     * What you remember and can convince the room of is the only record."* What shipped was the
     * claim text box on every phase that had nothing else to show — a keyboard, on eight phones,
     * during the twenty seconds the recap reel is playing.
     *
     * ⚠️ AND THE CLAIM BOX IS THE WORST THING TO PUT THERE, NOT A HARMLESS DEFAULT. It hands the
     * guide twenty idle seconds holding a PRODUCIBLE alibi — a written, timestamped, publishable
     * story composed while the evidence is still on screen — which attacks the one unwitnessed
     * asset the whole deduction rests on (D13). A map here would be worse still and was the
     * earlier advice; this reverses it.
     *
     * The ROLE tab stays, because §2.3 makes it persistent *"in any phase"* and it is hold-to-
     * reveal, so it is a thing you can check rather than a thing left on screen. Nothing else.
     */
    if (DARK.includes(p)) {
      box.innerHTML = '<div class="card"><div class="down">Phones down — talk</div>'
        + '<div class="say">' + esc(DARK_SAY[p]) + '</div></div>';
      return;
    }

    // 🚨 PREMIERE IS THE CARD AND NOTHING ELSE. It fell through to the claim plate, so a
    // first-time player's first sight of the game was a text box and a permanent public Publish
    // button, above the button that shows them who they are.
    if (p === 'PREMIERE') { box.innerHTML = premiereCard(); return; }

    box.innerHTML = claimCard();
    wireClaim();
  }

  /** Round §1's phase table, `Phones` column: the rows that read "dark". */
  const DARK = ['RECAP', 'EXECUTION', 'VERDICT'];
  const DARK_SAY = {
    RECAP: 'The recap is on the television. Nothing on this phone will remember it for you.',
    EXECUTION: 'Nobody says what they were.',
    VERDICT: 'Cameras and incidents, on the television.',
  };

  // ---------------------------------------------------------------- the guide's map
  /**
   * 🚨 THE MAP DRAWS WHAT ARRIVED AND NOTHING MORE. If `marks` holds no hunter, the guide does not
   * know where it is — there is no last-known ghost drawn here, no decayed blob, no "probably
   * around here". `darkrun.js` has a `ghost()` for that and it is deliberately not wired: an
   * honest guide who cannot see must have nothing to point at, or the deniable mistake the whole
   * design rests on stops being available to them.
   */
  function drawMap(f) {
    const c = $('map');
    if (!c || !f.plan) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const w = c.clientWidth, h = Math.round(w * 0.75);
    c.width = w * dpr; c.height = h * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const xs = f.plan.flatMap((r) => [r.x0, r.x1]), zs = f.plan.flatMap((r) => [r.z0, r.z1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    const pad = 10, k = Math.min((w - pad * 2) / (x1 - x0), (h - pad * 2) / (z1 - z0));
    const px = (x) => pad + (x - x0) * k, pz = (z) => pad + (z - z0) * k;
    g.clearRect(0, 0, w, h);
    for (const r of f.plan) {
      g.fillStyle = '#161b25'; g.strokeStyle = '#2a3244'; g.lineWidth = 1;
      g.fillRect(px(r.x0), pz(r.z0), (r.x1 - r.x0) * k, (r.z1 - r.z0) * k);
      g.strokeRect(px(r.x0), pz(r.z0), (r.x1 - r.x0) * k, (r.z1 - r.z0) * k);
    }
    for (const m of f.marks || []) {
      g.beginPath();
      g.arc(px(m.x), pz(m.z), m.kind === 'hunter' ? 7 : 5, 0, Math.PI * 2);
      g.fillStyle = m.kind === 'hunter' ? '#e4483a' : '#4cc27a';
      g.fill();
    }
  }

  // ---------------------------------------------------------------- the runner's stick
  let heading = 0, detent = 0, driveTimer = null;
  const DETENTS = ['STILL', 'CREEP', 'WALK', 'RUN'];
  function driveCard() {
    return '<div class="card"><h3>Drive</h3>'
      + '<canvas id="stick" style="width:100%;aspect-ratio:1/1;background:#0d1017;border-radius:16px;touch-action:none"></canvas>'
      + '<div class="note">Drag to steer. The ring is how far your noise carries.</div></div>'
      + '<div class="card" style="margin-top:10px"><h3>Throttle</h3>'
      + DETENTS.map((d, i) => '<button data-det="' + i + '"' + (i === detent ? ' class="on"' : '') + '>' + d + '</button>').join('')
      + '</div>';
  }
  function wireDrive() {
    for (const b of document.querySelectorAll('[data-det]')) {
      b.onclick = () => { detent = +b.dataset.det; controls(); pushDrive(); };
    }
    const c = $('stick');
    if (!c) return;
    const set = (e) => {
      const r = c.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      // Screen up is -Y and world north is +Z, so the stick's Y is negated exactly once, here.
      heading = Math.atan2(t.clientX - (r.left + r.width / 2), -(t.clientY - (r.top + r.height / 2)));
      paintStick(); pushDrive();
    };
    c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); set(e); });
    c.addEventListener('pointermove', (e) => { if (c.hasPointerCapture(e.pointerId)) set(e); });
    paintStick();
    if (driveTimer) clearInterval(driveTimer);
    driveTimer = setInterval(pushDrive, 250);       // a held heading still has to arrive
  }
  function paintStick() {
    const c = $('stick'); if (!c) return;
    const dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = w;
    c.width = w * dpr; c.height = h * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const cx = w / 2, cy = h / 2, R = w * 0.42;
    g.clearRect(0, 0, w, h);
    // The noise ring: `audibleRange(noise) = 14 * noise` metres, drawn to the same scale as the
    // stick so a detent's cost is a size rather than a number.
    const noise = [0, 0.90 / 5.20, 2.55 / 5.20, 1][detent];
    g.beginPath(); g.arc(cx, cy, Math.max(4, R * noise), 0, Math.PI * 2);
    g.fillStyle = 'rgba(228,72,58,0.16)'; g.fill();
    g.strokeStyle = 'rgba(228,72,58,0.5)'; g.stroke();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.strokeStyle = '#2a3244'; g.stroke();
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.sin(heading) * R, cy - Math.cos(heading) * R);
    g.strokeStyle = '#e0b23c'; g.lineWidth = 4; g.stroke();
  }
  const pushDrive = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'drive', heading, detent })); };

  /**
   * 🚨 REFUSE THE CHAIR — round §2. *"Once per game, a player voted into a chair may REFUSE THE
   * CHAIR. Public, attributed, permanent, and logged. The runner-up in that slot takes it."*
   *
   * `ballot.js`'s `refuse()` has been implemented and gated since it was written and was
   * unreachable, because `refuse` was absent from `session.js`'s INPUT list — so this button is
   * the last quarter of a feature that was three-quarters built. It is offered only while the
   * chair is still unused: once you have called it or moved, the chair has been spent.
   */
  function refuseCard() {
    const mine = ((frame && frame.players) || []).find((x) => x.id === iAm());
    if (!mine || mine.refused) return '';
    if (frame.you && frame.you.acted) return '';
    return '<button class="kill" id="refuse" style="margin-top:10px">Refuse the chair</button>'
      + '<div class="note">Once a game, and the runner-up takes it. Everyone is told it was you.</div>';
  }
  function wireRefuse() {
    if ($('refuse')) $('refuse').onclick = () => act({ t: 'refuse' });
  }

  /**
   * 🚨 **THE CLAIM PRESETS, AND THE FREE-TEXT BOX THEY REPLACE.** `rrr-phone-ux.md` §2.5's own
   * *cheap v1* is *"presets only, publish on tap, no drafts"*, and that is what this is — the
   * server has never carried a draft (`players[].claim` is PUBLISHED claims and nothing else), so
   * the text field was cheap v1 with the cheap part taken out and a keyboard put in.
   *
   * ⚠️ THESE ARE THE SEVEN GOOD CARDS BY THEIR SHIPPED DISPLAY NAMES — `roles.js`'s `SCRIPT`, in
   * the same words `rrr-roles.md` §2 uses. `show-wire` X15 compares this list against `SCRIPT` so
   * the two cannot drift; a claim the room cannot check against the script is not a claim.
   * Production is not offered, because a preset that nobody would ever tap is a wasted row.
   */
  const CLAIMS = ['Contestant', 'Camera Op', 'Focus Puller', 'Continuity', 'The Editor', 'Fan Favourite', 'Stunt Double'];

  /**
   * The claim plate and the nameplate rail — round §1's phase table, `Phones` column, which reads
   * **claims/nameplates only** for DEBRIEF.
   *
   * 🚨 NO KEYBOARD. What shipped here was a text input and a Publish button, and the comment
   * above `DARK` condemns exactly that: it hands a guide idle seconds holding a PRODUCIBLE alibi,
   * composed rather than said. A6 took it off the three phases the table calls dark — worth 20 s,
   * 20 s and 15 s — and left it on the seventy-five-second one, which is the phase it does the
   * most damage to, because DEBRIEF is the argument. A tap is a claim; a typed sentence is an
   * exhibit.
   */
  function claimCard() {
    const mine = ((frame && frame.players) || []).find((p) => p.id === iAm());
    const rail = '<div class="card" style="margin-top:10px"><h3>The table</h3>'
      + living().filter((p) => p.id !== iAm()).map((p) =>
        '<div class="plate">' + swatch(p.id) + '<b>' + esc(p.name) + '</b>'
        + '<span class="say">' + (p.claim ? '\u201c' + esc(p.claim) + '\u201d' : 'undeclared') + '</span></div>').join('')
      + '<div class="note">A nameplate is what somebody is willing to have checked. '
      + 'Everything else is said out loud.</div></div>';

    if (mine && mine.claim) {
      return '<div class="card"><h3>Your claim</h3><div class="say">You are telling the room you are '
        + '<b>' + esc(mine.claim) + '</b>. A published claim stands — there is no taking it back.</div></div>'
        + rail;
    }
    return '<div class="card"><h3>Claim a role, or don\'t</h3>'
      + CLAIMS.map((c) => '<button data-claim="' + esc(c) + '">' + esc(c) + '</button>').join('')
      + '<div class="note">One tap publishes it to your nameplate on the television, for the rest '
      + 'of the game. Blank is a statement too, and it is the default.</div></div>'
      + rail;
  }
  function wireClaim() {
    for (const b of document.querySelectorAll('[data-claim]')) {
      b.onclick = () => act({ t: 'claim', claim: b.dataset.claim });
    }
  }

  /**
   * PREMIERE. This used to fall through to the claim plate, so the first thing a first-time player
   * ever saw was a free-text box and an irreversible public Publish button sitting ABOVE the
   * button that shows them their own card. `rrr-phone-ux.md` §1 has the role card arriving *"on
   * deal"*; there is nothing else the phone should be during the premiere.
   */
  function premiereCard() {
    return '<div class="card"><h3>Your card</h3>'
      + '<div class="say">It is on this phone and on no screen in the room. Hold the button below '
      + 'to read it — it stays blurred until a finger is on it, so nobody beside you can read it '
      + 'over your shoulder and nobody has to remember to put it away.</div>'
      + '<div class="note">Then put the phone down. Everything after this happens out loud.</div></div>';
  }

  const colourOf = (id) => {
    const p = ((frame && frame.players) || []).find((x) => x.id === id);
    if (!p) return '#8b93a3';
    const r = roster.find((x) => x.seat === p.seat);
    // The seat's own colour is authoritative before the first roster lands, and identical after.
    return (r && r.colour) || (seat && p.seat === seat.seat ? seat.colour : '#8b93a3');
  };
  const swatch = (id) => '<span class="sw" style="background:' + colourOf(id) + '"></span>';
  const wing = () => ((frame && frame.expedition) || {}).room || 'house';

  /**
   * The casting ballot's one list. A name already taken shows the chair it holds and stays live so
   * it can be taken back; every other name goes flat once both chairs are full, because a third
   * tap that silently reassigned a chair is the mis-tap §2.6 calls the most expensive input error
   * in the game.
   */
  function castButtons(full) {
    return living().map((p) => {
      const role = pickRunner === p.id ? 'RUNNER' : pickGuide === p.id ? 'GUIDE' : null;
      return '<button data-pick="c|' + p.id + '"' + (role ? ' class="on"' : '')
        + (full && !role ? ' disabled' : '') + '>'
        + swatch(p.id) + esc(p.name)
        + (role ? '<span class="say warn" style="margin-left:auto">▶ ' + role + '</span>'
          : p.claim ? '<span class="say" style="margin-left:auto">“' + esc(p.claim) + '”</span>' : '')
        + '</button>';
    }).join('');
  }

  function peopleButtons(slot, chosen, excludeSelf) {
    return living().filter((p) => !(excludeSelf && p.id === iAm())).map((p) =>
      '<button data-pick="' + slot + '|' + p.id + '"' + (chosen === p.id ? ' class="on"' : '') + '>'
      + swatch(p.id) + esc(p.name)
      + (p.claim ? '<span class="say" style="margin-left:auto">“' + esc(p.claim) + '”</span>' : '')
      + '</button>').join('');
  }

  function render() {
    if (!frame) return;
    $('joinCard').classList.add('hide');
    $('play').classList.remove('hide');
    $('ph').textContent = frame.phase;
    const s = SAY[frame.phase];
    $('say').textContent = typeof s === 'function' ? s() : (s || '');
    if (frame.phase !== lastPhase) {
      // The card closes itself on every phase change — nobody has to remember to put it away.
      $('cardView').classList.remove('lit');
      $('cardView').classList.add('hide');
      pickRunner = pickGuide = null;
      lastPhase = frame.phase;
      $('refused').textContent = '';
    }
    controls();
  }

  function paintClock() {
    if (!frame || !frame.clock) return;
    $('clock').textContent = Math.max(0, Math.ceil((frame.clock.endsAt - Date.now()) / 1000)) + 's';
  }

  // ---------------------------------------------------------------- the wire
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/');
    ws.onopen = () => { backoff = 500; setState(seat ? 'connected' : 'ready'); if (wantJoin || localStorage.getItem(KEY)) join(); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'seated') {
        seat = m; localStorage.setItem(KEY, m.token);
        $('sw').style.background = m.colour; $('me').textContent = m.name;
        $('joinCard').classList.add('hide'); setState('connected');
      }
      if (m.t === 'full') { $('go').disabled = true; $('go').textContent = 'Room is full'; }
      /**
       * 🚨 A CLOSED DOOR WITH A REASON ON IT. The server used to seat a phone that arrived after
       * the bell, and a seated phone with no card is worse than a refused one: the deal was made
       * for the people who were in the room, so this phone would never be sent a single frame and
       * every tap would come back "not in this show". Nothing on the screen would say why.
       * A phone that locked and came back is not this — it reclaims by token and never gets here.
       */
      if (m.t === 'late') {
        $('go').disabled = true;
        $('go').textContent = 'Already rolling';
        $('joinNote').textContent = esc(m.why || 'the show has already started')
          + ' — you can watch on the television. The next one starts from the lobby.';
      }
      if (m.t === 'roster') {
        roster = m.players || [];
        if (seat) {
          const mine = roster.find((x) => x.seat === seat.seat);
          if (mine) { $('me').textContent = mine.name; $('rt').textContent = mine.rtt == null ? '' : mine.rtt + 'ms'; }
        }
        if (frame) render();
      }
      if (m.t === 'state') { frame = m.frame; render(); }
      if (m.t === 'refused') { $('refused').innerHTML = '<span class="warn">' + esc(m.why) + '</span>'; }
      if (m.t === 'reunion') {
        $('controls').innerHTML = '<div class="card"><h3>The Reunion</h3><div class="say">'
          + esc(m.outcome) + '. Look at the television.</div></div>';
      }
      // The pong echoes the SERVER's clock value. Phone clocks at a party disagree by minutes.
      if (m.t === 'ping') ws.send(JSON.stringify({ t: 'pong', at: m.at }));
    };
    ws.onclose = () => { setState('reconnecting…', true); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 5000); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  const setState = (txt, down) => { $('state').textContent = txt; $('bar').className = 'bar' + (down ? ' down' : ''); };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ws && ws.readyState > 1) { backoff = 500; connect(); }
  });
  setInterval(paintClock, 250);
  connect();
})();
</script>
