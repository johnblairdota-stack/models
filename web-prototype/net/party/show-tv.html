<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUN ROBOT RUN — Prime Time</title>
<!--
  📺 THE TELEVISION. Six of eight players are watching this and nothing else, so under D1 it is
  not polish — it is the mode's primary interface.

  🚨 THE TV IS A PURE OBSERVER OF STATE AND A REPORTER OF NOTHING ELSE. It renders the frame the
  server projected for it and computes no game truth of its own. Anything derived here would drift
  from the phones the moment a frame was dropped, and a lobby that disagrees with itself in front
  of eight people is worse than a blank screen. The one exception is the countdown, which is
  interpolated from `clock.endsAt` — a number every frame already carries — so the ring can move
  at 60fps without a packet per second.

  🚨 NOTHING ON THIS PAGE KNOWS AN ALIGNMENT, AND THERE IS NO PLACE TO PUT ONE. The server never
  sends it before the Reunion (`players[].alignment` has no matrix row), so the circle draws who is
  out and never why. That is bible P6, silent death, arriving as an absence rather than a promise.

  Every size is a couch size: read from three metres, by someone holding a drink.
-->
<style>
  :root{
    --ink:#f2f4f8; --dim:#8b93a3; --bg:#0b0d12; --panel:#141821; --edge:#232937;
    --live:#4cc27a; --gone:#e4483a; --warn:#e0b23c; --crew:#e0b23c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
       font:400 16px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
       display:grid;grid-template-rows:auto 1fr auto;gap:clamp(8px,1.4vh,20px);padding:clamp(14px,2vw,32px)}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .ep{font:600 clamp(13px,1.3vw,20px)/1 ui-sans-serif;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
  .phase{font:700 clamp(22px,3.4vw,56px)/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .timer{display:flex;align-items:center;gap:14px}
  .timer b{font:700 clamp(24px,3.4vw,56px)/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .ring{width:clamp(40px,4vw,72px);height:clamp(40px,4vw,72px);transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:7}
  .ring .bg{stroke:var(--edge)}
  .ring .fg{stroke:var(--warn);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .low .fg{stroke:var(--gone)}

  main{position:relative;min-height:0}
  #circle{position:absolute;inset:0}

  /**
   * 📺 THE LIVE FEED. The mansion renders in `src/views/expedition.js`, which needs a bundler and
   * a GPU, so it cannot be part of this zero-dependency page — it is composited in as a frame and
   * this page keeps the furniture. Full bleed, behind everything, and only during EXPEDITION.
   */
  #feed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;border-radius:12px}
  /* §4's nameplate rail: seat order, along the bottom, on an opaque plate — never on the feed. */
  #rail{position:absolute;left:0;right:0;bottom:0;display:flex;gap:clamp(6px,.8vw,14px)}
  #rail .seat{position:static;transform:none;width:auto;flex:1 1 0;min-width:0;
              background:var(--panel);border:1px solid var(--edge);border-radius:12px;
              padding:clamp(6px,.9vh,14px) clamp(4px,.5vw,12px)}
  .seat{position:absolute;transform:translate(-50%,-50%);text-align:center;width:clamp(110px,13vw,210px)}
  .seat .dot{width:clamp(26px,3vw,54px);height:clamp(26px,3vw,54px);border-radius:50%;margin:0 auto clamp(4px,.6vh,10px);
             display:grid;place-items:center;font:700 clamp(12px,1.2vw,20px)/1 ui-sans-serif;color:#0b0d12}
  .seat .nm{font:600 clamp(14px,1.5vw,26px)/1.1 ui-sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .tag{font:600 clamp(9px,.85vw,14px)/1.3 ui-sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);min-height:1.3em}
  .seat .claim{font:400 clamp(10px,1vw,16px)/1.3 ui-sans-serif;color:var(--dim);font-style:italic;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat.crew .tag{color:var(--crew)}
  .seat.out{opacity:.34}
  .seat.out .nm{text-decoration:line-through}
  .seat .voted{color:var(--live)}

  /* the middle of the circle: whatever the phase needs said */
  .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
         width:min(46%,640px);display:flex;flex-direction:column;gap:clamp(6px,1vh,14px)}
  .stage .big{font:700 clamp(20px,2.6vw,44px)/1.1 ui-sans-serif;letter-spacing:.02em}
  .stage .sub{font:400 clamp(12px,1.2vw,20px)/1.4 ui-sans-serif;color:var(--dim)}
  /* No `.call` rule, deliberately — see the EXPEDITION stage below and broadcast §6.9. A style
     for it is half of a reintroduction. */
  .clear{color:var(--live)} .bad{color:var(--gone)}
  /* The Debrief's evidence board. Two columns of fact/value, couch-legible, on an opaque plate —
     broadcast §4's ten-foot rules put nothing important straight on the feed. */
  .facts{display:grid;grid-template-columns:auto 1fr;gap:clamp(4px,.7vh,10px) clamp(10px,1.4vw,26px);
         text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:16px;
         padding:clamp(12px,1.6vw,26px)}
  .facts dt{color:var(--dim);font:600 clamp(10px,.95vw,15px)/1.6 ui-sans-serif;letter-spacing:.2em;text-transform:uppercase}
  .facts dd{font:600 clamp(14px,1.5vw,26px)/1.3 ui-sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  footer{display:flex;align-items:center;justify-content:space-between;gap:20px;
         font:600 clamp(11px,1.05vw,17px)/1 ui-sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  footer b{color:var(--ink)}
  .pips{display:inline-flex;gap:6px;vertical-align:middle;margin-left:.6em}
  .pip{width:clamp(9px,.9vw,15px);height:clamp(9px,.9vw,15px);border-radius:3px;background:var(--edge)}
  .pip.on{background:var(--live)}

  /* the lobby */
  .lobby{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;gap:clamp(14px,2vh,30px);
         background:var(--bg)}
  .call2{display:grid;grid-template-columns:1fr auto;gap:clamp(16px,2vw,36px);align-items:center;
         background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:clamp(16px,2.2vw,36px)}
  .label{color:var(--dim);font-size:clamp(11px,1vw,15px);letter-spacing:.28em;text-transform:uppercase;margin-bottom:.5em}
  .url{font:600 clamp(26px,4.6vw,72px)/1 ui-monospace,Menlo,monospace;word-break:break-all}
  .code{font:700 clamp(40px,6vw,104px)/1 ui-monospace,Menlo,monospace;color:var(--warn);letter-spacing:.1em}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(9px,1.1vw,18px)}
  .slot{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:clamp(10px,1.2vw,20px);
        display:flex;align-items:center;gap:.6em;font:600 clamp(15px,1.8vw,30px)/1 ui-sans-serif;min-height:clamp(64px,10vh,120px)}
  .slot.empty{opacity:.32;border-style:dashed;color:var(--dim);font-weight:400}
  .slot .sw{width:clamp(16px,1.6vw,28px);height:clamp(16px,1.6vw,28px);border-radius:50%;flex:none}
  .hint{text-align:center;color:var(--dim);font:600 clamp(12px,1.3vw,22px)/1 ui-sans-serif;letter-spacing:.2em;text-transform:uppercase}
  .hint kbd{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:.25em .6em;color:var(--ink)}
  .hide{display:none!important}

  /* the reunion */
  .roll{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1vh,16px);text-align:left;
        max-height:70vh;overflow:auto}
  .row{display:flex;align-items:baseline;gap:.6em;background:var(--panel);border:1px solid var(--edge);
       border-radius:10px;padding:clamp(8px,1vh,14px) clamp(10px,1vw,18px);font-size:clamp(12px,1.2vw,20px)}
  .row .who{font-weight:700;min-width:6em}
  .row .was{color:var(--warn)}
  .row .al{margin-left:auto;font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
</style>

<header>
  <div><div class="ep" id="ep">Prime Time</div><div class="phase" id="phase">Lobby</div></div>
  <div class="timer" id="timer">
    <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="arc" cx="50" cy="50" r="42"/></svg>
    <b id="clock">—</b>
  </div>
</header>

<main id="main">
  <div id="circle"></div>
  <div id="rail" class="hide"></div>
  <div class="stage" id="stage"></div>

  <div class="lobby" id="lobby">
    <div class="call2">
      <div><div class="label">On your phone, open</div><div class="url" id="url">…</div></div>
      <div><div class="label">Room</div><div class="code" id="code">····</div></div>
    </div>
    <div>
      <div class="grid" id="slots"></div>
      <div class="hint" style="margin-top:clamp(12px,2vh,26px)" id="startHint">Waiting for phones</div>
    </div>
  </div>
</main>

<footer>
  <span>Cameras <b id="cams">0/0</b><span class="pips" id="campips"></span></span>
  <span>Incidents <b id="alarms">0</b></span>
  <span id="crewline">—</span>
  <span id="net">connecting…</span>
</footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const R = 42, C = 2 * Math.PI * R;

  let frame = null, seats = [], code = '', joinUrl = '', started = false, special = null;

  /**
   * 📺 **THE LIVE FEED — the ninety seconds this page exists for, and it was not on it.**
   *
   * Under D1 six of eight players see nothing but this screen during EXPEDITION. What they saw
   * was the word EXPEDITION, a countdown ring and eight static dots: `src/views/expedition.js` —
   * the Director, the mansion, the shot solver — was a SEPARATE PAGE that nothing composited.
   * `progress/storyboard/08-expedition.png` is a photograph of that, with all eight phones below
   * reading "Watch the television."
   *
   * 🚨 IT IS A FRAME, NOT AN IMPORT, AND THAT IS FORCED RATHER THAN CHOSEN. The mansion imports
   * `three` by bare specifier and needs a bundler; this page is served as text by a node server
   * with no `node_modules` (see `show.mjs`'s header — *"zero dependencies, no build step … a party
   * server you cannot start at a party does not get started"*). So the house runs under vite on
   * its own port and is composited in here.
   *
   * 🚨 AND THE PARTY MUST STILL PLAY WITH NO HOUSE AT ALL, BECAUSE THAT IS THE SHIPPED
   * CONFIGURATION TODAY. The feed is shown only once the mansion has said it is up — one
   * `postMessage` from `expedition.js`'s `markReady()`. No message, no feed, and EXPEDITION falls
   * back to exactly the page that shipped: the circle and the stage line. There is no timeout, no
   * spinner and no error card, because §6.5 forbids all three on this screen.
   *
   * 🚨 THE FRAME IS TOLD A WING AND A SOCKET, AND NOTHING ELSE. It joins as `role=sim`, which
   * `show.mjs` briefs with four fields and no roster — so the 3D half never holds an identity and
   * the nameplate rail below is drawn HERE, from the frame the server projected for the TV.
   */
  const HOUSE = (() => {
    const q = new URLSearchParams(location.search).get('house');
    if (q === 'off') return null;                       // a party with no 3D half, on purpose
    return q || location.protocol + '//' + location.hostname + ':5178';   // `npm run party:house`
  })();
  let feedEl = null, feedReady = false;

  function mountFeed() {
    if (feedEl || !HOUSE) return;
    const join = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?role=sim';
    feedEl = document.createElement('iframe');
    feedEl.id = 'feed';
    feedEl.className = 'hide';
    // The mansion has a soundtrack and this frame is cross-origin: without the delegation the
    // autoplay policy suspends its AudioContext and the television is silent — broadcast §3.
    feedEl.setAttribute('allow', 'autoplay');
    feedEl.setAttribute('scrolling', 'no');
    // `chrome=feed` — the overlay inside the frame keeps the lower third and the shot bug and
    // drops the show bug, the camera wall and the segment clock, which THIS page already carries.
    // Two camera counters disagreeing by one is worse television than either of them alone.
    feedEl.src = HOUSE + '/?view=party.expedition&chrome=feed&join=' + encodeURIComponent(join);
    $('main').insertBefore(feedEl, $('circle'));
  }

  // The only thing the house is allowed to say to this page, and it is checked by SOURCE rather
  // than by origin string: the house may be on any port the host started it on.
  addEventListener('message', (e) => {
    if (!feedEl || e.source !== feedEl.contentWindow) return;
    if (e.data && e.data.t === 'rrr.feed' && e.data.ready && !feedReady) {
      feedReady = true;
      if (frame) render();
    }
  });

  // ---------------------------------------------------------------- the circle
  function drawCircle() {
    const box = $('circle');
    const players = (frame && frame.players) || [];
    if (!players.length) { box.innerHTML = ''; return; }
    const w = box.clientWidth, h = box.clientHeight;
    const rx = w * 0.36, ry = h * 0.34, cx = w / 2, cy = h / 2;
    const colourOf = (seat) => (seats.find((s) => s.seat === seat) || {}).colour || '#8b93a3';

    box.innerHTML = players.map((p, i) => {
      const a = (i / players.length) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      const isRunner = frame.pair && frame.pair.runner === p.id;
      const isGuide = frame.pair && frame.pair.guide === p.id;
      // 🚨 HOW SOMEBODY LEFT, NEVER WHAT THEY WERE. `taken` says the Hunter; otherwise the table
      // swung the hammer. Neither says a word about alignment, because nothing here has one.
      const tag = !p.alive ? (p.taken ? '✖ taken' : '⚒ evicted')
        : isRunner ? '▶ runner' : isGuide ? '◉ guide'
        : votedTag(p.id);
      const cls = 'seat' + (p.alive ? '' : ' out') + ((isRunner || isGuide) ? ' crew' : '');
      return '<div class="' + cls + '" style="left:' + x + 'px;top:' + y + 'px">'
        + '<div class="dot" style="background:' + colourOf(p.seat) + '">' + (p.seat + 1) + '</div>'
        + '<div class="nm">' + esc(p.name) + '</div>'
        + '<div class="tag">' + tag + '</div>'
        + '<div class="claim">' + (p.claim ? '“' + esc(p.claim) + '”' : '') + '</div>'
        + '</div>';
    }).join('');
  }

  /**
   * §4's permanent nameplate rail, which the circle becomes while the feed is up: *"name, current
   * public claim, ALIVE / OUT, and this round's RUNNER / GUIDE badges. Never alignment, never true
   * role."* Same five fields the circle draws, laid along the bottom on an opaque plate — §4 puts
   * nothing important straight on the feed.
   */
  function drawRail() {
    const players = (frame && frame.players) || [];
    $('rail').innerHTML = players.map((p) => {
      const isRunner = frame.pair && frame.pair.runner === p.id;
      const isGuide = frame.pair && frame.pair.guide === p.id;
      // The same non-colour channel the circle uses, because half a party room is looking at the
      // screen sideways: ✕ taken, ⚒ evicted, ⬤ alive. Never a word about what any of them was.
      const mark = p.alive ? '⬤' : (p.taken ? '✕' : '⚒');
      const cls = 'seat' + (p.alive ? '' : ' out') + ((isRunner || isGuide) ? ' crew' : '');
      return '<div class="' + cls + '">'
        + '<div class="nm">' + mark + ' ' + esc(p.name) + '</div>'
        + '<div class="claim">' + (p.claim ? '“' + esc(p.claim) + '”' : '—') + '</div>'
        + '<div class="tag">' + (isRunner ? '▶ runner' : isGuide ? '◉ guide' : '') + '</div>'
        + '</div>';
    }).join('');
  }

  /**
   * ⚠️ THE TV SHOWS THAT A PHONE HAS ACTED, NEVER WHAT IT DID. During CASTING and VOTE the useful
   * thing on screen is who the table is still waiting for. The choice itself is not on this frame
   * at all — `you.acted` is self-audience and the tally is withheld until the phase closes — so
   * there is nothing here to leak even by accident.
   */
  function votedTag(id) {
    if (!frame) return '';
    if (frame.phase === 'VOTE' || frame.phase === 'CASTING') return '';
    const nom = (frame.nominations || []).find((n) => n.target === id);
    return nom ? '<span class="bad">◆ on the block</span>' : '';
  }

  // ---------------------------------------------------------------- the middle
  const STAGE = {
    PREMIERE: () => big('Check your phone.', 'Your card is private. Read it, then put the phone face down.'),
    CASTING: () => big('Who runs, and who guides?',
      wing() + ' this episode. Two taps each — argue about the job, not the person.'),
    /**
     * 🚨 THE CALL IS NEVER PRINTED HERE — broadcast §6.9. *"Never show the runner's private
     * prompts or the guide's callouts as on-screen text. The guide talks out loud, in the room.
     * That is the game."* This used to print CLEAR at sixty-eight pixels across the middle of the
     * circle, which did the guide's talking for them and left the DEBRIEF arguing with a caption
     * instead of with each other. The television says only that the guide has spoken — the frame
     * no longer carries what they said (`entitle.js`, `call.said` → `guide`), so there is nothing
     * on this page to print even by accident.
     */
    EXPEDITION: () => {
      const c = frame.call || {};
      const guide = nameOf(frame.pair && frame.pair.guide);
      if (!c.made) return big('Into ' + esc(wing()) + '.', guide + ' is watching the cameras.');
      return big(esc(guide) + ' has called it.',
        'Out loud, in the room. ' + nameOf(frame.pair && frame.pair.runner) + ' decides.');
    },
    RECAP: () => {
      const o = (frame.expedition || {}).outcome;
      if (o === 'taken') return big('<span class="bad">Taken.</span>', 'The terminal stays dark.');
      if (o === 'lit') return big('<span class="clear">Camera live.</span>', 'One more room on the map.');
      if (o === 'held') return big('They held.', 'Safe, and no closer to seeing the house.');
      return big('…', '');
    },
    /**
     * 🚨 **THE DEBRIEF IS THE PHASE THAT NEEDS THE EVIDENCE AND IT WAS THE ONE PHASE THAT THREW IT
     * AWAY.** This read `big('Talk.', ...)` and nothing else: the outcome, the wing and the pair
     * were on the frame the whole time, rowed `all` in `entitle.js`, and the television showed
     * them for the twenty seconds of RECAP and then cleared the screen for the seventy-five
     * seconds during which eight people are supposed to argue about them. Round §1 gives DEBRIEF
     * to *"talking in the room"*; a room arguing from memory about a card that was on screen a
     * minute ago is arguing about who remembers better.
     *
     * ⚠️ AND THE ONE THING THAT STAYS OFF IT IS THE GUIDE'S CALL — broadcast §6.9, *"never show
     * the runner's private prompts or the guide's callouts as on-screen text"*. It is not on this
     * frame to print (`call.said` is rowed `guide`) and the line below deliberately says only
     * that they spoke, which is the fact the clock already made public. Everything here is
     * something the whole room watched happen.
     */
    DEBRIEF: () => {
      const e = frame.expedition || {};
      const runner = nameOf(frame.pair && frame.pair.runner);
      const guide = nameOf(frame.pair && frame.pair.guide);
      const happened = {
        taken: '<span class="bad">The Hunter had them</span>',
        lit: '<span class="clear">The camera came on</span>',
        held: 'They held at the door',
      }[e.outcome] || 'Nothing aired';
      const cams = frame.cameras || {};
      return '<div class="big">Talk.</div>'
        + '<dl class="facts">'
        + '<dt>Wing</dt><dd>' + esc(wing()) + '</dd>'
        + '<dt>Ran</dt><dd>' + esc(runner) + '</dd>'
        + '<dt>Guided</dt><dd>' + esc(guide) + '</dd>'
        + '<dt>Outcome</dt><dd>' + happened + '</dd>'
        + '<dt>Cameras</dt><dd>' + (cams.unlocked || 0) + ' of ' + (cams.needed || 0) + ' lit</dd>'
        + '<dt>Incidents</dt><dd>' + ((frame.incident || {}).alarms || 0) + ' this season</dd>'
        + '</dl>'
        + '<div class="sub">'
        + esc(guide === '—' ? 'Out loud, to the room.'
          : guide + ' called it out loud, and what they said is not written down anywhere.')
        + '</div>';
    },
    RECKONING: () => {
      const n = frame.nominations || [];
      if (!n.length) return big('Nominate, or don\'t.', 'Once each. Three stand at most, and every one buys the table fifteen seconds.');
      return '<div class="big">On the block</div>' + n.map((x) =>
        '<div class="sub"><b>' + esc(nameOf(x.target)) + '</b> — put up by ' + esc(nameOf(x.nominator)) + '</div>').join('');
    },
    VOTE: () => big('Vote.', 'More than half the living, or nobody swings. Abstaining protects them.'),
    /**
     * 🚨 THE EXECUTIONER IS THE ONLY THING ON THIS PAGE THAT COMES FROM AN EVENT RATHER THAN THE
     * FRAME, AND IT HAS TO. `vote.js`'s `executioner()` already resolves the single nominator and
     * the SHOWRUNNER fallback, and `session.js` logs the answer PUBLIC on `player.executed` — but
     * the answer is not on the frame, because a nominator who was TAKEN this episode is not the
     * nominator who swings, and no field on the frame records that substitution. Deriving it here
     * from `nominations[]` would be the television computing game truth, which this page does not
     * do. So it reads the one event that carries it. See `onEvent` for why that is a whitelist.
     */
    EXECUTION: () => {
      const ex = frame.tally && frame.tally.executed;
      const by = execution && execution.id === ex ? execution.executioner : null;
      return big('<span class="bad">' + esc(nameOf(ex)) + '</span> voted out',
        by ? 'Nominated by ' + esc(swingerName(by)) + ' — who swings. Nobody says what they were.'
          : 'The sledgehammer. Nobody says what they were.');
    },
    // Round §4 airs the cameras as *"n of N lit"*. It read `unlocked + ' cameras live'`, which was
    // a different quantity under a third name — see `coverage.js` on the establishing camera.
    VERDICT: () => {
      const c = frame.cameras || {};
      return big(status(), (c.unlocked || 0) + ' of ' + (c.needed || 0) + ' cameras lit · '
        + ((frame.incident || {}).alarms || 0) + ' incidents');
    },
    REUNION: () => reunionStage(),
  };

  const big = (a, b) => '<div class="big">' + a + '</div><div class="sub">' + esc(b) + '</div>';

  /**
   * 🚨 **THE MIDDLE OF THE TELEVISION READ "Into the study_w." AT 44 PIXELS.** `wing()` returned
   * the raw room id — the identifier the code passes around — to eight people sitting three metres
   * away, in the one phase where the whole room is looking at this screen.
   *
   * `src/party/captions.js` exports `ROOM_LABEL` for exactly this and the labels are the level
   * designer's own names, pinned to the engine by `expedition-wire` E1b. This page cannot import
   * it — it is served as text by a node server with no bundler — so the table is copied here and
   * `show-wire` X17 holds the copy against the original character for character. A copy nobody
   * checks is how the television ends up calling a room something nobody else does.
   */
  const ROOM_LABEL = {
    ballroom: 'THE BALLROOM', gallery: 'THE LONG GALLERY', study_w: 'THE WEST STUDY',
    study_e: 'THE EAST STUDY', service: 'THE SERVICE PASSAGE', chapel: 'THE CHAPEL',
  };
  /** `executioner()` returns a playerId or the string SHOWRUNNER when the nominator was taken. */
  const swingerName = (id) => (id === 'SHOWRUNNER' ? 'nobody left standing — the Showrunner' : nameOf(id));
  const wing = () => ROOM_LABEL[(frame.expedition || {}).room] || '—';
  const nameOf = (id) => { const p = ((frame && frame.players) || []).find((x) => x.id === id); return p ? p.name : '—'; };
  const status = () => {
    const c = frame.cameras || {};
    return c.unlocked >= c.needed ? 'The season is made.' : 'Still shooting.';
  };

  function reunionStage() {
    if (!special) return big('The Reunion', 'Roll call coming up.');
    return '<div class="big">' + esc(special.outcome || 'The Reunion') + '</div>'
      + '<div class="roll">' + special.rollCall.map((p) =>
        '<div class="row"><span class="who">' + esc(nameOf(p.id) === '—' ? p.id : nameOf(p.id)) + '</span>'
        + '<span class="was">' + esc(p.role) + '</span>'
        + (p.believedTheyWere && p.believedTheyWere !== p.role
            ? '<span class="sub">believed ' + esc(p.believedTheyWere) + '</span>' : '')
        + '<span class="al">' + esc(p.alignment) + '</span></div>').join('') + '</div>';
  }

  // ---------------------------------------------------------------- the event stream
  /**
   * 🚨 A WHITELIST, AND IT MUST NEVER BECOME A SWITCHBOARD. This socket receives every PUBLIC
   * event in the game, and `call.made` — the guide's callout, in full, with a name on it — is one
   * of them. Broadcast §6.9 forbids that ever being on-screen text, so a handler that rendered
   * "whatever arrived" would undo the row that keeps it off the frame, from the other direction.
   * One event type is read here. Adding a second is a decision about what television shows, not a
   * refactor.
   *
   * ⚠️ REPLAYS ARRIVE THE SAME WAY. A television that reconnects mid-show is caught up through
   * `replayFor` with `replay:true` on every frame, so this must be idempotent — it is, because it
   * stores the last swing rather than accumulating.
   */
  let execution = null;
  function onEvent(ev) {
    if (!ev || ev.type !== 'player.executed') return;
    execution = ev.data;
    if (frame) render();
  }

  // ---------------------------------------------------------------- the clock
  function paintClock() {
    if (!frame || !frame.clock) return;
    const total = frame.clock.seconds || 1;
    const left = Math.max(0, (frame.clock.endsAt - Date.now()) / 1000);
    $('clock').textContent = Math.ceil(left) + 's';
    $('arc').style.strokeDasharray = C;
    $('arc').style.strokeDashoffset = C * (1 - left / total);
    $('timer').className = 'timer' + (left <= 10 ? ' low' : '');
  }

  function render() {
    if (!frame) return;
    $('lobby').classList.toggle('hide', started);
    $('ep').textContent = frame.phase === 'REUNION' ? 'The Reunion' : 'Episode ' + frame.episode;
    $('phase').textContent = frame.phase;

    /**
     * 🚨 THE FEED AIRS DURING EXPEDITION AND IN NO OTHER PHASE. It is the only phase with anything
     * happening in the house; a live corridor under the vote would be the Director editing an
     * argument. And it airs only once the house has said it is up — with no house the circle and
     * the stage line are what EXPEDITION has always been, which is a party that still plays.
     */
    const onAir = !!feedEl && feedReady && frame.phase === 'EXPEDITION';
    if (feedEl) feedEl.classList.toggle('hide', !onAir);
    $('rail').classList.toggle('hide', !onAir);
    $('circle').classList.toggle('hide', onAir);
    $('stage').classList.toggle('hide', onAir);
    $('stage').innerHTML = onAir ? '' : (STAGE[frame.phase] || (() => ''))();
    const c = frame.cameras || {};
    $('cams').textContent = (c.unlocked || 0) + '/' + (c.needed || 0);
    $('campips').innerHTML = Array.from({ length: c.needed || 0 },
      (_, i) => '<span class="pip' + (i < c.unlocked ? ' on' : '') + '"></span>').join('');
    $('alarms').textContent = (frame.incident || {}).alarms || 0;
    $('crewline').textContent = frame.pair && frame.pair.runner
      ? nameOf(frame.pair.runner) + ' runs · ' + nameOf(frame.pair.guide) + ' guides' : '—';
    if (onAir) drawRail(); else drawCircle();
    paintClock();
  }

  function renderLobby() {
    $('url').textContent = joinUrl.replace(/^https?:\/\//, '');
    $('code').textContent = (code || '····').toUpperCase();
    $('slots').innerHTML = Array.from({ length: 8 }, (_, i) => {
      const s = seats.find((x) => x.seat === i);
      return s
        ? '<div class="slot"><span class="sw" style="background:' + s.colour + '"></span>' + esc(s.name) + '</div>'
        : '<div class="slot empty">seat ' + (i + 1) + '</div>';
    }).join('');
    const n = seats.filter((s) => s.live).length;
    $('startHint').innerHTML = n >= 4
      ? 'Press <kbd>space</kbd> to roll — ' + n + ' phones seated'
      : n + ' of 4 needed';
  }

  // ---------------------------------------------------------------- the wire
  let ws;
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?role=tv');
    ws.onopen = () => { $('net').textContent = 'live'; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'hello') { code = m.code; joinUrl = m.url; renderLobby(); }
      if (m.t === 'roster') { seats = m.players; started = m.started; renderLobby(); if (started) render(); }
      /**
       * 🚨 THE HOUSE IS LOADED WHEN THE SHOW ROLLS, NOT WHEN THE EXPEDITION OPENS. A mansion is
       * seconds of loading; mounting it at the top of EXPEDITION spends them out of the ninety
       * that are the segment. It stays mounted for the whole show and re-arms on each `brief`,
       * which is why `expedition.js` has a brief handler at all.
       */
      if (m.t === 'state') { frame = m.frame; started = true; mountFeed(); render(); }
      if (m.t === 'event') onEvent(m.ev);
      if (m.t === 'reunion') { special = { ...m.special, outcome: m.outcome }; render(); }
      if (m.t === 'notice' && !m.ok) { $('startHint').textContent = m.why; }
    };
    ws.onclose = () => { $('net').textContent = 'reconnecting…'; setTimeout(connect, 1000); };
  }

  // The machine driving the television has a keyboard; the television does not. Space rolls, S
  // skips a phase the room has plainly finished with.
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); ws && ws.send(JSON.stringify({ t: 'start' })); }
    if (e.key === 's' || e.key === 'S') ws && ws.send(JSON.stringify({ t: 'skip' }));
  });
  // The circle is laid out in pixels, so it is the one thing that has to be redrawn on a resize.
  // The rail is flexbox and looks after itself.
  addEventListener('resize', () => { if (started && !$('circle').classList.contains('hide')) drawCircle(); });
  setInterval(paintClock, 100);
  renderLobby();
  connect();
})();
</script>
