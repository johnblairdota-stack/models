<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUN ROBOT RUN — lobby</title>
<!--
  📺 THE TELEVISION, DURING THE LOBBY ONLY.

  🚨 EVERY SIZE HERE IS A COUCH SIZE, NOT A DESK SIZE. This page is read from three metres away by
  someone holding a drink, so the join URL and the code are the two largest things on the screen
  and nothing else competes with them. If a guest has to stand up and walk to the TV to read the
  address, the spike has already failed its own question.

  ⚠️ NO FRAMEWORK, NO BUILD, NO IMPORTS. `spike.mjs` serves this file verbatim off disk with no
  bundler in the loop, so it must run as-is in whatever browser is attached to the television.
-->
<style>
  :root{
    --ink:#f2f4f8; --dim:#8b93a3; --bg:#0b0d12; --panel:#141821; --edge:#232937;
    --live:#4cc27a; --gone:#e4483a; --warn:#e0b23c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:400 16px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
       min-height:100vh;padding:clamp(16px,2.5vw,40px);display:flex;flex-direction:column;gap:clamp(12px,2vh,28px)}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
  h1{font-size:clamp(18px,2vw,30px);letter-spacing:.22em;font-weight:600;text-transform:uppercase}
  h1 b{color:var(--warn);font-weight:600}
  .meta{color:var(--dim);font-size:clamp(12px,1.1vw,17px);letter-spacing:.08em;font-variant-numeric:tabular-nums}

  /* the two things a guest actually needs */
  .call{display:grid;grid-template-columns:1fr auto;gap:clamp(16px,2vw,36px);align-items:center;
        background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:clamp(18px,2.4vw,40px)}
  .label{color:var(--dim);font-size:clamp(11px,1vw,15px);letter-spacing:.28em;text-transform:uppercase;margin-bottom:.5em}
  .url{font:600 clamp(30px,5.4vw,86px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .code{font:700 clamp(44px,7vw,120px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--warn);letter-spacing:.1em}

  .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.2vw,20px);flex:1}
  @media (max-aspect-ratio:1/1){.seats{grid-template-columns:repeat(2,1fr)}}
  .seat{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:clamp(12px,1.4vw,22px);
        display:flex;flex-direction:column;gap:.45em;justify-content:center;min-height:clamp(90px,13vh,170px)}
  .seat.empty{opacity:.34;border-style:dashed}
  .seat .who{display:flex;align-items:center;gap:.55em;font-size:clamp(18px,2.2vw,38px);font-weight:600;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:.62em;height:.62em;border-radius:50%;flex:none;box-shadow:0 0 0 .18em rgba(255,255,255,.06)}
  .seat .stat{color:var(--dim);font-size:clamp(11px,1.05vw,17px);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .seat.dropped .who{color:var(--gone)}
  .seat.dropped .stat b{color:var(--gone)}
  .slow{color:var(--warn)}
  footer{color:var(--dim);font-size:clamp(11px,1vw,16px);letter-spacing:.1em;display:flex;gap:1.6em;flex-wrap:wrap}
  .bad{color:var(--gone)}
</style>

<header>
  <h1>Run Robot Run · <b>Prime Time</b></h1>
  <div class="meta"><span id="count">0</span>/8 seated · <span id="clock">0:00</span> · <span id="link">connecting…</span></div>
</header>

<div class="call">
  <div><div class="label">On your phone, open</div><div class="url" id="url">…</div></div>
  <div><div class="label">Room</div><div class="code" id="code">····</div></div>
</div>

<div class="seats" id="seats"></div>

<footer>
  <span>Boot budget <b>8.0s</b> — anything slower shows amber.</span>
  <span id="worst">worst cold boot: —</span>
  <span id="drops">reconnects: 0</span>
  <span>Report: <b>/report</b></span>
</footer>

<script>
  // 🚨 THE TV IS A PURE OBSERVER. It sends nothing and decides nothing; the lobby on the server is
  // the only truth. Anything the TV computed locally would drift from the phones the moment a
  // frame was dropped, and a lobby that disagrees with itself is worse than one that is blank.
  const seats = document.getElementById('seats');
  const fmtMs = (v) => v == null ? '—' : v >= 1000 ? (v / 1000).toFixed(1) + 's' : v + 'ms';
  const BUDGET = 8000;
  let started = Date.now();

  function render(players, capacity) {
    const n = capacity || 8;
    seats.innerHTML = '';
    let live = 0, drops = 0, worst = null;
    for (let i = 0; i < n; i++) {
      const p = players.find((x) => x.seat === i);
      const el = document.createElement('div');
      el.className = 'seat' + (!p ? ' empty' : p.live ? '' : ' dropped');
      if (p) {
        if (p.live) live++;
        drops += p.drops;
        if (p.bootMs != null) worst = Math.max(worst ?? 0, p.bootMs);
        const slow = p.bootMs != null && p.bootMs > BUDGET;
        el.innerHTML =
          '<div class="who"><span class="dot" style="background:' + p.colour + '"></span>' +
          escapeHtml(p.name) + '</div>' +
          '<div class="stat">' +
            (p.live ? 'ping <b>' + (p.rtt == null ? '—' : p.rtt + 'ms') + '</b>' : '<b>dropped</b>') +
            ' · boot <b class="' + (slow ? 'slow' : '') + '">' + fmtMs(p.bootMs) + '</b>' +
            (p.drops ? ' · ' + p.drops + '× back' : '') +
          '</div>';
      } else {
        el.innerHTML = '<div class="who" style="color:var(--dim)">seat ' + (i + 1) + '</div>'
          + '<div class="stat">waiting</div>';
      }
      seats.appendChild(el);
    }
    document.getElementById('count').textContent = live;
    document.getElementById('drops').textContent = 'reconnects: ' + drops;
    const w = document.getElementById('worst');
    w.textContent = 'worst cold boot: ' + fmtMs(worst);
    w.className = worst != null && worst > BUDGET ? 'bad' : '';
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    document.getElementById('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 1000);

  // ⚠️ THE TV RECONNECTS FOREVER AND SILENTLY. A television that gives up after five tries turns a
  // flaky router into a dead party; the phones' own reconnects are what the spike is measuring,
  // not this one's.
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?role=tv');
    ws.onopen = () => { document.getElementById('link').textContent = 'live'; };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.t === 'hello') {
        document.getElementById('url').textContent = m.url.replace(/^https?:\/\//, '');
        document.getElementById('code').textContent = m.code.toUpperCase();
      }
      if (m.t === 'roster') render(m.players, m.capacity);
    };
    ws.onclose = () => {
      document.getElementById('link').textContent = 'reconnecting…';
      setTimeout(connect, 1000);
    };
  }
  render([], 8);
  connect();
</script>
